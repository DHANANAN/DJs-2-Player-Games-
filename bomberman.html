<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Bomberman — DJ's Games Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--green:#00ff88;
  --panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:.7rem .5rem;overflow-x:hidden;touch-action:none;}
body::before{content:'';position:fixed;inset:0;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;}
.nav{width:100%;max-width:680px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.4rem .8rem;letter-spacing:.1em;transition:all .3s;}
.back:hover{color:var(--cyan);border-color:var(--cyan);}
.title{font-family:'Press Start 2P',monospace;font-size:.8rem;color:var(--gold);
  text-shadow:0 0 18px rgba(255,215,0,.6);}

/* MODES */
.mode-row{display:flex;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap;justify-content:center;}
.m-btn{
  font-family:'Orbitron',sans-serif;font-size:.58rem;font-weight:700;
  letter-spacing:.1em;padding:.4rem .9rem;background:transparent;color:var(--dim);
  border:1px solid var(--dim);cursor:pointer;transition:all .25s;
}
.m-btn.active{background:var(--cyan);color:var(--bg);border-color:var(--cyan);box-shadow:0 0 16px rgba(0,245,255,.4);}
.m-btn.fai.active{background:var(--green);border-color:var(--green);box-shadow:0 0 16px rgba(0,255,136,.4);}
.m-btn.hai.active{background:var(--magenta);border-color:var(--magenta);box-shadow:0 0 16px rgba(255,0,170,.4);}

.hud{width:100%;max-width:680px;display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;margin-bottom:.5rem;}
.p-hud{border:1px solid var(--border);background:var(--panel);padding:.4rem .8rem;}
.p-name{font-family:'Orbitron',sans-serif;font-size:.5rem;letter-spacing:.12em;margin-bottom:.2rem;}
.p-name.p1{color:var(--cyan);}
.p-name.p2{color:var(--magenta);}
.p-lives{font-size:1.1rem;letter-spacing:.2rem;}
.p-power{font-family:'Orbitron',sans-serif;font-size:.42rem;color:var(--dim);}
.mid-hud{border:1px solid var(--border);background:var(--panel);padding:.4rem .6rem;text-align:center;}
.mid-val{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;color:var(--gold);}
.mid-lbl{font-family:'Orbitron',sans-serif;font-size:.42rem;color:var(--dim);}

.cw{position:relative;width:min(680px,98vw);border:1px solid var(--border);background:#010108;margin-bottom:.5rem;touch-action:none;}
.cw::before{content:'';position:absolute;inset:-2px;background:linear-gradient(90deg,var(--gold),var(--magenta),var(--cyan));z-index:-1;opacity:.4;}
canvas{display:block;width:100%;touch-action:none;}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,4,13,.92);z-index:20;padding:1rem;}
.ov.h{display:none;}
.ot{font-family:'Press Start 2P',monospace;font-size:clamp(.85rem,4vw,1.4rem);color:var(--gold);text-shadow:0 0 28px rgba(255,215,0,.7);text-align:center;margin-bottom:.6rem;}
.os{font-family:'Orbitron',sans-serif;font-size:.55rem;color:var(--dim);letter-spacing:.1em;margin-bottom:1.1rem;text-align:center;line-height:1.8;}
.ob{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;
  padding:.7rem 1.8rem;background:var(--gold);color:var(--bg);border:none;cursor:pointer;transition:all .25s;}
.ob:hover{background:#fff;}

/* Touch Controls */
.touch-bar{width:100%;max-width:680px;display:flex;justify-content:space-between;gap:1rem;margin-bottom:.5rem;}
.v-dpad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px;gap:4px;}
.v-btn{
  background:rgba(0,245,255,0.15);border:1.5px solid rgba(0,245,255,0.4);
  color:var(--cyan);font-size:1.1rem;border-radius:8px;display:flex;
  align-items:center;justify-content:center;touch-action:none;user-select:none;cursor:pointer;
}
.v-btn:active{background:rgba(0,245,255,0.5);}
.v-bomb{
  padding:.8rem 1.8rem;border-radius:12px;background:rgba(255,0,170,0.2);
  border:2px solid #ff00aa;color:#fff;font-family:'Orbitron',sans-serif;
  font-weight:900;font-size:.85rem;display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;cursor:pointer;
}
.v-bomb:active{background:rgba(255,0,170,0.6);}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="back">← Hub</a>
  <span class="title">💣 Bomberman</span>
  <span style="width:70px"></span>
</nav>

<div class="mode-row">
  <button class="m-btn fai active" id="mFAI" onclick="setMode('fai')">💚 vs FAI (Easy Bot)</button>
  <button class="m-btn hai" id="mHAI" onclick="setMode('hai')">🔥 vs HAI (Bomber Pro)</button>
  <button class="m-btn" id="m2P" onclick="setMode('2p')">👥 Local 2P</button>
</div>

<div class="hud">
  <div class="p-hud">
    <div class="p-name p1">// PLAYER 1 (YOU)</div>
    <div class="p-lives" id="lives1">❤❤❤</div>
    <div class="p-power" id="pow1">💣×1 🔥×2 👟×3</div>
  </div>
  <div class="mid-hud">
    <div class="mid-val" id="timerEl">3:00</div>
    <div class="mid-lbl">Time</div>
  </div>
  <div class="p-hud" style="text-align:right">
    <div class="p-name p2" id="lblP2">FAI BOT //</div>
    <div class="p-lives" id="lives2">❤❤❤</div>
    <div class="p-power" id="pow2">💣×1 🔥×2 👟×3</div>
  </div>
</div>

<div class="cw" id="cw">
  <canvas id="c"></canvas>
  <div class="ov" id="ov">
    <div class="ot">💣 BOMBERMAN</div>
    <div class="os">Plant bombs · Destroy blocks · Collect power-ups<br>
      P1: WASD + F bomb (or on-screen buttons)<br>
      Power-ups: 💣 Extra Bombs · 🔥 Blast Range · 👟 Speed</div>
    <button class="ob" onclick="startGame()">START BATTLE</button>
  </div>
</div>

<div class="touch-bar">
  <div class="v-dpad">
    <div></div><button class="v-btn" id="vU">▲</button><div></div>
    <button class="v-btn" id="vL">◀</button><button class="v-btn" id="vD">▼</button><button class="v-btn" id="vR">▶</button>
  </div>
  <button class="v-bomb" id="vB">💣 DROP BOMB</button>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const COLS=13, ROWS=11, CELL=40;
let W=COLS*CELL, H=ROWS*CELL;

canvas.width=W; canvas.height=H;
document.getElementById('cw').style.width=W+'px';

const keys={};
let grid, players=[], bombs=[], explosions=[], powerups=[];
let running=false, animId=null, gameTimer=180*60;
let mode='fai'; // 'fai', 'hai', '2p'

const P1_KEYS={up:'w',down:'s',left:'a',right:'d',bomb:'f'};
const P2_KEYS={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',bomb:'l'};

function initGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      if(r%2===1&&c%2===1){ grid[r][c]=1; continue; }
      if(r===0||r===ROWS-1||c===0||c===COLS-1){ grid[r][c]=1; continue; }
      const corner=(r<=1&&c<=1)||(r<=1&&c>=COLS-2)||(r>=ROWS-2&&c<=1)||(r>=ROWS-2&&c>=COLS-2);
      grid[r][c]=corner?0:(Math.random()<0.6?2:0);
    }
  }
}

function mkPlayer(row,col,keys_,col1,col2,idx){
  return{
    row, col, x:col*CELL, y:row*CELL,
    color:col1, glow:col2, keys:keys_,
    lives:3, bombCount:1, bombsPlaced:0,
    flameRange:2, speed:2.6, alive:true,
    invincible:0, idx
  };
}

function initPlayers(){
  players=[
    mkPlayer(1,1,P1_KEYS,'#00f5ff','rgba(0,245,255,.8)',0),
    mkPlayer(ROWS-2,COLS-2,P2_KEYS,mode==='fai'?'#00ff88':'#ff00aa','rgba(255,0,170,.8)',1)
  ];
  bombs=[]; explosions=[]; powerups=[];
  updateHUDDisplays();
}

window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if(e.key.length===1) keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(e.key.length===1) keys[e.key.toLowerCase()]=false;
});

// Touch D-Pad
function bindTouchBtn(id, key){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true;});
  el.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false;});
  el.addEventListener('mousedown',()=>{keys[key]=true;});
}
bindTouchBtn('vU','w'); bindTouchBtn('vD','s'); bindTouchBtn('vL','a'); bindTouchBtn('vR','d');
bindTouchBtn('vB','f');
window.addEventListener('mouseup',()=>{ keys['w']=keys['s']=keys['a']=keys['d']=keys['f']=false; });

function updateHUDDisplays(){
  players.forEach((p,i)=>{
    document.getElementById('lives'+(i+1)).textContent='❤'.repeat(Math.max(0,p.lives));
    document.getElementById('pow'+(i+1)).textContent=`💣×${p.bombCount} 🔥×${p.flameRange} 👟×${Math.floor(p.speed)}`;
  });
}

function update(){
  if(!running) return;

  players.forEach((p,pi)=>{
    if(!p.alive) return;
    if(p.invincible>0) p.invincible--;

    let dx=0, dy=0;
    if(pi===0 || mode==='2p'){
      const k=p.keys;
      if(keys[k.up]) dy=-1;
      else if(keys[k.down]) dy=1;
      else if(keys[k.left]) dx=-1;
      else if(keys[k.right]) dx=1;

      if(keys[k.bomb] && p.bombsPlaced<p.bombCount){
        placeBomb(p);
      }
    } else {
      // AI Bot update for P2
      const move = updateBot(p);
      dx=move.dx; dy=move.dy;
      if(move.bomb && p.bombsPlaced<p.bombCount) placeBomb(p);
    }

    // Grid collision movement
    let nx=p.x+dx*p.speed, ny=p.y+dy*p.speed;
    function blocked(px,py){
      const m=4;
      const r1=Math.floor((py+m)/CELL), r2=Math.floor((py+CELL-m-1)/CELL);
      const c1=Math.floor((px+m)/CELL), c2=Math.floor((px+CELL-m-1)/CELL);
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
        if(r<0||r>=ROWS||c<0||c>=COLS) return true;
        if(grid[r][c]===1||grid[r][c]===2) return true;
        const bombHere=bombs.find(b=>b.row===r&&b.col===c&&!b.justPlaced);
        if(bombHere) return true;
      }
      return false;
    }

    if(!blocked(nx,p.y)) p.x=nx;
    if(!blocked(p.x,ny)) p.y=ny;

    p.row=Math.floor((p.y+CELL/2)/CELL);
    p.col=Math.floor((p.x+CELL/2)/CELL);

    // Power-up collection
    powerups=powerups.filter(pu=>{
      if(pu.row===p.row&&pu.col===p.col){
        if(pu.type===3) p.bombCount=Math.min(p.bombCount+1,5);
        if(pu.type===4) p.flameRange=Math.min(p.flameRange+1,6);
        if(pu.type===5) p.speed=Math.min(p.speed+0.4,4.5);
        updateHUDDisplays();
        return false;
      }
      return true;
    });

    // Explosion damage
    if(p.invincible<=0){
      const hit=explosions.some(ex=>ex.cells.some(cell=>cell.r===p.row&&cell.c===p.col));
      if(hit){
        p.lives--;
        p.invincible=120;
        updateHUDDisplays();
        if(p.lives<=0){ p.alive=false; checkWin(); }
      }
    }
  });

  // Bombs update
  bombs.forEach(b=>{
    b.timer--;
    if(b.justPlaced&&b.timer<150) b.justPlaced=false;
    if(b.timer<=0) explodeBomb(b);
  });

  // Explosions update
  explosions=explosions.filter(ex=>{ ex.timer--; return ex.timer>0; });
}

function updateBot(p){
  // Check if standing in bomb blast radius -> prioritize escape
  const inDanger = bombs.some(b=>Math.hypot(b.row-p.row, b.col-p.col) < 3);
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const validDirs=dirs.filter(([dr,dc])=>{
    const nr=p.row+dr, nc=p.col+dc;
    if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return false;
    return grid[nr][nc]===0 && !bombs.some(b=>b.row===nr&&b.col===nc);
  });

  if(validDirs.length===0) return {dx:0, dy:0, bomb:false};

  let chosen = validDirs[Math.floor(Math.random()*validDirs.length)];
  let wantBomb = false;

  if(mode==='hai'){
    // HAI: actively hunts blocks to blast and powerups
    const nearBlock = dirs.some(([dr,dc])=>{
      const nr=p.row+dr, nc=p.col+dc;
      return nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc]===2;
    });
    if(nearBlock && Math.random()<0.08 && !inDanger) wantBomb=true;
  } else {
    // FAI: places bomb rarely
    if(Math.random()<0.015 && !inDanger) wantBomb=true;
  }

  return {dx:chosen[1], dy:chosen[0], bomb:wantBomb};
}

function placeBomb(p){
  const row=p.row, col=p.col;
  if(bombs.some(b=>b.row===row&&b.col===col)) return;
  p.bombsPlaced++;
  bombs.push({row, col, timer:180, owner:p, range:p.flameRange, justPlaced:true});
}

function explodeBomb(bomb){
  bombs=bombs.filter(b=>b!==bomb);
  bomb.owner.bombsPlaced=Math.max(0, bomb.owner.bombsPlaced-1);
  const cells=[{r:bomb.row, c:bomb.col}];

  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dr,dc])=>{
    for(let i=1; i<=bomb.range; i++){
      const r=bomb.row+dr*i, c=bomb.col+dc*i;
      if(r<0||r>=ROWS||c<0||c>=COLS) break;
      if(grid[r][c]===1) break; // solid wall
      cells.push({r, c});
      if(grid[r][c]===2){ // destructible block
        grid[r][c]=0;
        if(Math.random()<0.35){
          powerups.push({row:r, col:c, type:Math.floor(Math.random()*3)+3});
        }
        break;
      }
    }
  });

  explosions.push({cells, timer:28});
}

function checkWin(){
  const p1Dead = !players[0].alive;
  const p2Dead = !players[1].alive;
  if(p1Dead || p2Dead){
    endGame(p1Dead && p2Dead ? 'draw' : (p1Dead ? 2 : 1));
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#020208'; ctx.fillRect(0,0,W,H);

  // Grid blocks
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const x=c*CELL, y=r*CELL;
    if(grid[r][c]===1){
      ctx.fillStyle='#1e293b'; ctx.fillRect(x,y,CELL,CELL);
      ctx.strokeStyle='#334155'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,CELL-2,CELL-2);
    } else if(grid[r][c]===2){
      ctx.fillStyle='#b45309'; ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
      ctx.strokeStyle='#d97706'; ctx.lineWidth=2; ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
    }
  }

  // Powerups
  powerups.forEach(pu=>{
    const x=pu.col*CELL+CELL/2, y=pu.row*CELL+CELL/2;
    ctx.font='18px Orbitron'; ctx.textAlign='center';
    ctx.fillText(pu.type===3?'💣':(pu.type===4?'🔥':'👟'), x, y+6);
  });

  // Bombs
  bombs.forEach(b=>{
    const x=b.col*CELL+CELL/2, y=b.row*CELL+CELL/2;
    const pulse = Math.sin(b.timer*0.2)*3;
    ctx.fillStyle='#000'; ctx.shadowColor='#ff00aa'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(x, y, 12+pulse, 0, Math.PI*2); ctx.fill();
    ctx.font='14px Orbitron'; ctx.textAlign='center'; ctx.fillText('💣', x, y+5);
    ctx.shadowBlur=0;
  });

  // Explosions
  explosions.forEach(ex=>{
    ctx.fillStyle='rgba(255,100,0,0.85)';
    ex.cells.forEach(cell=>{
      ctx.fillRect(cell.c*CELL+2, cell.r*CELL+2, CELL-4, CELL-4);
    });
  });

  // Players
  players.forEach(p=>{
    if(!p.alive) return;
    if(p.invincible>0 && Math.floor(p.invincible/6)%2===0) return;
    ctx.shadowColor=p.color; ctx.shadowBlur=14;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x+CELL/2, p.y+CELL/2, 13, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });
}

function loop(){
  update();
  draw();
  if(running) animId=requestAnimationFrame(loop);
}

function startGame(){
  initGrid();
  initPlayers();
  running=true;
  document.getElementById('ov').classList.add('h');
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function endGame(winner){
  running=false;
  cancelAnimationFrame(animId);
  const ov=document.getElementById('ov');
  ov.classList.remove('h');
  ov.querySelector('.ot').textContent = winner===1 ? '🏆 YOU ELIMINATED OPPONENT!' : (winner===2?'🤖 BOT SURVIVED!':'💥 MUTUAL DESTRUCTION!');
  ov.querySelector('.os').textContent = winner===1 ? 'Masterful bomb battle tactics!' : 'Watch out for blast lines!';
  ov.querySelector('.ob').textContent = 'BATTLE AGAIN';
}

function setMode(m){
  mode=m;
  document.getElementById('mFAI').classList.toggle('active',m==='fai');
  document.getElementById('mHAI').classList.toggle('active',m==='hai');
  document.getElementById('m2P').classList.toggle('active',m==='2p');
  document.getElementById('lblP2').textContent = m==='fai'?'FAI BOT //':(m==='hai'?'HAI PRO //':'PLAYER 2 //');
}

initGrid(); initPlayers();
draw();
</script>
</body>
</html>
