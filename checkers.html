<style id="dj-global-theme-style">

  --cyan: #ffd700 !important;
  --magenta: #e6a100 !important;

  --dim: #8a7343 !important;
  background-color: #0c0a04 !important;
  background-image: linear-gradient(rgba(255, 215, 0, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.04) 1px, transparent 1px) !important;
  background-size: 28px 28px !important;
}
html.theme-retro, body.theme-retro {
  --bg: #020b05 !important;

  --border: rgba(57, 255, 20, 0.28) !important;
  --panel: rgba(57, 255, 20, 0.06) !important;
  --text: #b3ffd9 !important;
  --dim: #326943 !important;
  background-color: #020b05 !important;
}
html.theme-retro body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 10000;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
  background-size: 100% 3px, 6px 100%;

<script>
(function(){
  const t = localStorage.getItem('djhub_theme') || 'neon';
  document.documentElement.className = 'theme-' + t;
})();
</script>
<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--green:#00ff88;--red:#ff4455;
  --panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;
  --sq-light:#151828;--sq-dark:#0a0c16;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1rem .8rem;overflow-x:hidden;touch-action:none;}
body::before{content:'';position:fixed;inset:0;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;}
.nav{width:100%;max-width:540px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.45rem .9rem;letter-spacing:.1em;transition:all .3s;}
.back:hover{color:var(--cyan);border-color:var(--cyan);}
.title{font-family:'Press Start 2P',monospace;font-size:.85rem;color:var(--red);
  text-shadow:0 0 18px rgba(255,68,85,.6);}

/* MODES */
.mode-row{display:flex;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap;justify-content:center;}
.m-btn{
  font-family:'Orbitron',sans-serif;font-size:.58rem;font-weight:700;
  letter-spacing:.1em;padding:.45rem 1rem;background:transparent;color:var(--dim);
  border:1px solid var(--dim);cursor:pointer;transition:all .25s;
}
.m-btn.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 16px rgba(255,68,85,.4);}
.m-btn.fai.active{background:var(--green);border-color:var(--green);color:var(--bg);box-shadow:0 0 16px rgba(0,255,136,.4);}
.m-btn.hai.active{background:var(--magenta);border-color:var(--magenta);color:#fff;box-shadow:0 0 16px rgba(255,0,170,.4);}

.status-bar{
  width:100%;max-width:540px;display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--border);background:var(--panel);padding:.6rem 1.2rem;margin-bottom:.6rem;
}
.turn-ind{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.1em;}
.score-badge{font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--gold);}

.board-wrap{
  position:relative;width:min(540px,96vw);aspect-ratio:1;border:1px solid var(--border);
  background:#020208;margin-bottom:.6rem;user-select:none;touch-action:none;
}
.board-wrap::before{content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,var(--red),var(--magenta),var(--cyan));z-index:-1;opacity:.4;}

.board{
  display:grid;grid-template-columns:repeat(8, 1fr);grid-template-rows:repeat(8, 1fr);
  width:100%;height:100%;
}
.sq{
  display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;transition:background .15s;
}
.sq.light{background:var(--sq-light);}
.sq.dark{background:var(--sq-dark);}
.sq.selected{background:rgba(0,245,255,.25)!important;box-shadow:inset 0 0 0 2px var(--cyan);}
.sq.hint::after{
  content:'';position:absolute;width:28%;height:28%;border-radius:50%;
  background:rgba(0,255,136,.55);box-shadow:0 0 10px #00ff88;
}

.piece{
  width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;box-shadow:0 4px 8px rgba(0,0,0,.6);transition:transform .12s;
}
.piece.p1{background:radial-gradient(circle at 35% 35%,#ff6677,#cc0022);border:2px solid #ff99aa;}
.piece.p2{background:radial-gradient(circle at 35% 35%,#555566,#111118);border:2px solid #888899;}
.piece.fai{background:radial-gradient(circle at 35% 35%,#55ff99,#00aa44);border:2px solid #99ffcc;}
.piece.king::after{content:'👑';font-size:.95rem;}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(4,4,13,.92);z-index:10;padding:1rem;}
.ov.h{display:none;}
.ot{font-family:'Press Start 2P',monospace;font-size:clamp(.85rem,3.5vw,1.5rem);
  color:var(--gold);text-shadow:0 0 28px rgba(255,215,0,.7);text-align:center;margin-bottom:.6rem;}
.os{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--dim);letter-spacing:.12em;margin-bottom:1.4rem;text-align:center;line-height:1.8;}
.ob{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;
  padding:.8rem 2rem;background:var(--red);color:#fff;border:none;cursor:pointer;transition:all .25s;}
.ob:hover{background:#fff;color:var(--bg);}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="back">← Hub</a>
  <span class="title">🏁 Checkers</span>
  <span style="width:70px"></span>
</nav>

<div class="mode-row">
  <button class="m-btn fai active" id="mFAI" onclick="setMode('fai')">💚 vs FAI (Easy Bot)</button>
  <button class="m-btn hai" id="mHAI" onclick="setMode('hai')">🔥 vs HAI (Grandmaster)</button>
  <button class="m-btn" id="m2P" onclick="setMode('2p')">👥 Local 2P</button>
</div>

<div class="status-bar">
  <div class="turn-ind" id="turnInd">YOUR TURN (RED)</div>
  <div class="score-badge" id="scoreBadge">Red: 12 | Opp: 12</div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <div class="ov" id="ov">
    <div class="ot">🏁 CHECKERS</div>
    <div class="os">Standard 8×8 Draughts · Diagonal Jumps &amp; Multi-Captures<br>Crown Kings by reaching opposite rank!</div>
    <button class="ob" onclick="startGame()">PLAY CHECKERS</button>
  </div>
</div>

<script>
let boardState=[];
let turn='r'; // 'r' = Red (P1 / You), 'b' = Black/Green (P2 / Bot)
let selectedSquare=null;
let legalMoves=[];
let mode='fai'; // 'fai', 'hai', '2p'
let running=false;

function initBoard(){
  boardState=Array(8).fill(null).map(()=>Array(8).fill(null));
  for(let r=0; r<8; r++){
    for(let c=0; c<8; c++){
      if((r+c)%2 === 1){
        if(r<3) boardState[r][c] = {color:'b', king:false};
        else if(r>4) boardState[r][c] = {color:'r', king:false};
      }
    }
  }
  turn='r';
  selectedSquare=null;
  legalMoves=[];
  updateUI();
  renderBoard();
}

function renderBoard(){
  const bEl=document.getElementById('board');
  bEl.innerHTML='';
  for(let r=0; r<8; r++){
    for(let c=0; c<8; c++){
      const sq=document.createElement('div');
      const isDark = (r+c)%2 === 1;
      sq.className = `sq ${isDark?'dark':'light'}`;
      if(selectedSquare && selectedSquare.r===r && selectedSquare.c===c) sq.classList.add('selected');
      if(legalMoves.some(m=>m.toR===r && m.toC===c)) sq.classList.add('hint');

      const piece = boardState[r][c];
      if(piece){
        const pDiv=document.createElement('div');
        const pClass = piece.color==='r' ? 'p1' : (mode==='fai'?'fai':'p2');
        pDiv.className = `piece ${pClass} ${piece.king?'king':''}`;
        sq.appendChild(pDiv);
      }

      sq.addEventListener('click', ()=>handleSquareClick(r,c));
      sq.addEventListener('touchstart', e=>{ e.preventDefault(); handleSquareClick(r,c); }, {passive:false});
      bEl.appendChild(sq);
    }
  }
}

function handleSquareClick(r,c){
  if(!running) return;
  if(turn==='b' && mode!=='2p') return; // AI Turn

  const piece = boardState[r][c];
  if(piece && piece.color === turn){
    selectedSquare = {r,c};
    legalMoves = getMovesForPiece(r,c);
    renderBoard();
    return;
  }

  if(selectedSquare){
    const move = legalMoves.find(m=>m.toR===r && m.toC===c);
    if(move){
      makeMove(move);
      return;
    }
  }

  selectedSquare = null;
  legalMoves = [];
  renderBoard();
}

function getMovesForPiece(r,c){
  const p = boardState[r][c];
  if(!p) return [];
  const moves = [];
  const dirs = [];
  if(p.king){
    dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
  } else if(p.color==='r'){
    dirs.push([-1,-1],[-1,1]);
  } else {
    dirs.push([1,-1],[1,1]);
  }

  // Jumps (captures)
  dirs.forEach(([dr,dc])=>{
    const jumpR = r + dr*2, jumpC = c + dc*2;
    const midR = r + dr, midC = c + dc;
    if(jumpR>=0 && jumpR<8 && jumpC>=0 && jumpC<8){
      const midPiece = boardState[midR][midC];
      const targetSq = boardState[jumpR][jumpC];
      if(midPiece && midPiece.color !== p.color && !targetSq){
        moves.push({fromR:r, fromC:c, toR:jumpR, toC:jumpC, jump:true, midR, midC});
      }
    }
  });

  // Regular steps if no jumps
  dirs.forEach(([dr,dc])=>{
    const tr = r + dr, tc = c + dc;
    if(tr>=0 && tr<8 && tc>=0 && tc<8){
      if(!boardState[tr][tc]){
        moves.push({fromR:r, fromC:c, toR:tr, toC:tc, jump:false});
      }
    }
  });

  return moves;
}

function getAllMovesForColor(color){
  const allMoves = [];
  for(let r=0; r<8; r++){
    for(let c=0; c<8; c++){
      if(boardState[r][c] && boardState[r][c].color === color){
        allMoves.push(...getMovesForPiece(r,c));
      }
    }
  }
  // Mandatory jumps if any exist
  const jumps = allMoves.filter(m=>m.jump);
  return jumps.length > 0 ? jumps : allMoves;
}

function makeMove(m){
  const p = boardState[m.fromR][m.fromC];
  boardState[m.toR][m.toC] = p;
  boardState[m.fromR][m.fromC] = null;

  if(m.jump){
    boardState[m.midR][m.midC] = null;
  }

  // King promotion
  if((p.color==='r' && m.toR===0) || (p.color==='b' && m.toR===7)){
    p.king = true;
  }

  // Check multi-jump chain
  if(m.jump){
    const furtherJumps = getMovesForPiece(m.toR, m.toC).filter(jm=>jm.jump);
    if(furtherJumps.length > 0){
      selectedSquare = {r:m.toR, c:m.toC};
      legalMoves = furtherJumps;
      renderBoard();
      if(turn==='b' && mode!=='2p'){
        setTimeout(()=>makeMove(furtherJumps[0]), 350);
      }
      return;
    }
  }

  selectedSquare = null;
  legalMoves = [];
  turn = turn==='r' ? 'b' : 'r';
  updateUI();
  renderBoard();
  checkGameOver();

  if(turn==='b' && mode!=='2p' && running){
    setTimeout(triggerAIMove, 500);
  }
}

function triggerAIMove(){
  const allMoves = getAllMovesForColor('b');
  if(allMoves.length === 0){
    endGame('r');
    return;
  }

  if(mode==='fai'){
    // FAI: Friendly AI - picks random or non-optimal move
    const chosen = allMoves[Math.floor(Math.random()*allMoves.length)];
    makeMove(chosen);
  } else {
    // HAI: Minimax evaluation prioritizing king making and captures
    let bestMove = allMoves[0], bestScore = -Infinity;
    allMoves.forEach(m=>{
      let score = m.jump ? 15 : 1;
      if(m.toR === 7) score += 20; // Promotion
      if(m.toC === 0 || m.toC === 7) score += 3; // Safe edges
      if(score > bestScore){
        bestScore = score;
        bestMove = m;
      }
    });
    makeMove(bestMove);
  }
}

function updateUI(){
  let redCount=0, oppCount=0;
  for(let r=0; r<8; r++) for(let c=0; c<8; c++){
    if(boardState[r][c]?.color==='r') redCount++;
    if(boardState[r][c]?.color==='b') oppCount++;
  }
  document.getElementById('scoreBadge').textContent = `Red: ${redCount} | Opp: ${oppCount}`;
  const isRed = turn==='r';
  document.getElementById('turnInd').textContent = isRed ? 'YOUR TURN (RED)' : (mode==='2p'?'PLAYER 2 TURN':'BOT THINKING...');
  document.getElementById('turnInd').style.color = isRed ? 'var(--red)' : (mode==='fai'?'var(--green)':'var(--magenta)');
}

function checkGameOver(){
  const moves = getAllMovesForColor(turn);
  if(moves.length === 0){
    endGame(turn==='r'?'b':'r');
  }
}

function startGame(){
  initBoard();
  running=true;
  document.getElementById('ov').classList.add('h');
}

function endGame(winner){
  running=false;
  const ov=document.getElementById('ov');
  ov.classList.remove('h');
  const youWon = winner==='r';
  ov.querySelector('.ot').textContent = youWon ? '🏆 CHECKERS MASTER!' : '🤖 OPPONENT TOOK THE BOARD!';
  ov.querySelector('.os').textContent = youWon ? 'Brilliant diagonal jump tactical victory!' : 'Good match! Challenge again.';
  ov.querySelector('.ob').textContent = 'PLAY AGAIN';
}

function setMode(m){
  mode=m;
  document.getElementById('mFAI').classList.toggle('active',m==='fai');
  document.getElementById('mHAI').classList.toggle('active',m==='hai');
  document.getElementById('m2P').classList.toggle('active',m==='2p');
  if(running) initBoard();
}

initBoard();
</script>
</body>
</html>
