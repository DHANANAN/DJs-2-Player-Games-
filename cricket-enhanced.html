<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cricket — DJ's Games Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--orange:#ff8800;
  --panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.2rem 1rem;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;}
.nav{width:100%;max-width:700px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.45rem .9rem;letter-spacing:.1em;transition:all .3s;}
.back:hover{color:var(--cyan);border-color:var(--cyan);}
.title{font-family:'Press Start 2P',monospace;font-size:.85rem;color:var(--orange);
  text-shadow:0 0 18px rgba(255,136,0,.6);}
.level-badge{font-family:Orbitron,sans-serif;font-size:.5rem;color:var(--gold);}
.scores{width:100%;max-width:700px;display:grid;grid-template-columns:1fr auto 1fr;margin-bottom:.8rem;}
.sb{text-align:center;padding:.6rem;border:1px solid var(--border);background:var(--panel);}
.sb+.sb{border-left:none;}
.sn{font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;color:var(--gold);}
.sl{font-family:'Orbitron',sans-serif;font-size:.5rem;color:var(--dim);letter-spacing:.12em;}
.cw{position:relative;width:min(700px,96vw);border:1px solid var(--border);background:#001a00;margin-bottom:.8rem;}
.cw::before{content:'';position:absolute;inset:-2px;background:linear-gradient(135deg,var(--orange),var(--cyan));z-index:-1;opacity:.4;}
canvas{display:block;width:100%;}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,4,13,.9);z-index:10;}
.ov.h{display:none;}
.ot{font-family:'Press Start 2P',monospace;font-size:clamp(.85rem,3.5vw,1.5rem);color:var(--orange);text-shadow:0 0 28px rgba(255,136,0,.7);text-align:center;margin-bottom:.6rem;}
.os{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--dim);letter-spacing:.12em;margin-bottom:1.4rem;text-align:center;line-height:2;}
.ob{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;padding:.8rem 2rem;background:var(--orange);color:var(--bg);border:none;cursor:pointer;transition:all .25s;}
.ob:hover{background:#fff;}
.ctrl{width:100%;max-width:700px;border:1px solid var(--border);background:var(--panel);padding:.8rem 1.2rem;font-size:.85rem;color:var(--dim);}
</style>
</head>
<body>
<nav class="nav">
   <a href="../index.html" class="back">← Hub</a>
   <span class="title">Cricket</span>
   <span class="level-badge" id="lvlBadge">Lv1/10</span>
</nav>
<div class="scores">
   <div class="sb"><div class="sn" id="yourRuns">0</div><div class="sl">Your Runs</div></div>
   <div class="sb"><div class="sn" id="balls">Balls: 0/6</div><div class="sl">Over</div></div>
   <div class="sb"><div class="sn" id="aiRuns">0</div><div class="sl">AI Runs</div></div>
</div>
<div class="cw">
   <canvas id="c" height="500"></canvas>
   <div class="ov" id="ov">
     <div class="ot">CRICKET</div>
     <div class="os">Batting Mode · Hit the ball!<br>Arrow Keys to aim</div>
     <button class="ob" onclick="startGame()">PLAY</button>
   </div>
</div>
<div class="ctrl">
Select shot direction with arrow keys. Time your swing for maximum runs! 10 difficulty levels with varied bowling speeds and spin.
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H;
const keys={};

const LEVELS=[
  {ballSpeed:3, spinChance:0.20, aiDmg:15},
  {ballSpeed:3.3, spinChance:0.25, aiDmg:16},
  {ballSpeed:3.6, spinChance:0.30, aiDmg:17},
  {ballSpeed:3.9, spinChance:0.35, aiDmg:18},
  {ballSpeed:4.2, spinChance:0.40, aiDmg:19},
  {ballSpeed:4.5, spinChance:0.45, aiDmg:20},
  {ballSpeed:4.8, spinChance:0.50, aiDmg:21},
  {ballSpeed:5.1, spinChance:0.55, aiDmg:22},
  {ballSpeed:5.4, spinChance:0.60, aiDmg:23},
  {ballSpeed:5.7, spinChance:0.65, aiDmg:24}
];

let currentLevel=0;
let batter={x:0,y:0,angle:0},bowler={x:0,y:0},ball={x:0,y:0,vx:0,vy:0,r:6,active:false};
let gameRunning=false,animId=null,ballsInOver=0,runsYou=0,runsAI=0;
let ballTrajectory=[],particles=[];

function resize(){
  W=canvas.offsetWidth;
  H=500;
  canvas.width=W;
  canvas.height=H;
}

function initGame(){
  resize();
  batter={x:W/2,y:3*H/4,angle:0,hitPower:0};
  bowler={x:W/2,y:H/4};
  ballsInOver=0;
  runsYou=0;
  runsAI=0;
  gameRunning=true;
  ballTrajectory=[];
}

window.addEventListener('keydown',e=>{keys[e.key]=true;});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

function tick(){
  if(!gameRunning)return;
  const level=LEVELS[currentLevel];
  
  // Player aiming
  if(keys['ArrowLeft']) batter.angle=Math.max(batter.angle-0.08,-Math.PI/2);
  if(keys['ArrowRight']) batter.angle=Math.min(batter.angle+0.08,Math.PI/2);
  if(keys[' ']&&!ball.active){
    ball.active=true;
    ball.x=bowler.x;
    ball.y=bowler.y;
    
    let vx=level.ballSpeed;
    let vy=Math.random()>0.5?level.ballSpeed*0.3:-level.ballSpeed*0.3;
    
    if(Math.random()<level.spinChance){
      const spin=Math.random()>0.5?1:-1;
      vx*=(0.8+spin*0.3);
      vy+=spin*1.5;
    }
    
    ball.vx=vx;
    ball.vy=vy;
    ballTrajectory=[];
  }
  
  if(ball.active){
    ball.x+=ball.vx;
    ball.y+=ball.vy;
    ballTrajectory.push({x:ball.x,y:ball.y});
    
    // Hit detection
    const distToBat=Math.hypot(ball.x-batter.x,ball.y-batter.y);
    if(distToBat<30){
      ball.active=false;
      const hitDir=Math.cos(batter.angle);
      const runs=hitDir>0.7?6:(hitDir>0.3?4:1);
      runsYou+=runs;
      createHitEffect(ball.x,ball.y);
      ballsInOver++;
    }
    
    // Miss
    if(ball.y>H*0.85||ballTrajectory.length>100){
      ball.active=false;
      ballsInOver++;
    }
  }
  
  if(ballsInOver>=6){
    endInning();
    return;
  }
  
  particles.forEach(p=>{p.life-=0.05;});
  particles=particles.filter(p=>p.life>0);
  
  document.getElementById('yourRuns').textContent=runsYou;
  document.getElementById('balls').textContent=`Balls: ${ballsInOver}/6`;
  document.getElementById('aiRuns').textContent=runsAI;
  
  draw();
}

function createHitEffect(x,y){
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2;
    particles.push({x,y,vx:Math.cos(angle)*4,vy:Math.sin(angle)*4,life:1,color:'#ff8800',size:Math.random()*2+1});
  }
}

function draw(){
  ctx.fillStyle='#001a00';
  ctx.fillRect(0,0,W,H);
  
  // Pitch
  ctx.strokeStyle='#00ff00';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(W/3,H/3);
  ctx.lineTo(W/3,2*H/3);
  ctx.moveTo(2*W/3,H/3);
  ctx.lineTo(2*W/3,2*H/3);
  ctx.stroke();
  
  // Bowler
  ctx.fillStyle='#ff6600';
  ctx.beginPath();
  ctx.arc(bowler.x,bowler.y,12,0,Math.PI*2);
  ctx.fill();
  
  // Batter
  ctx.fillStyle='#00ff88';
  ctx.save();
  ctx.translate(batter.x,batter.y);
  ctx.rotate(batter.angle);
  ctx.fillRect(-5,-20,10,40);
  ctx.restore();
  
  // Ball trajectory
  ctx.strokeStyle='rgba(255,136,0,.3)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<ballTrajectory.length;i++){
    const p=ballTrajectory[i];
    if(i===0)ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
  
  // Ball
  if(ball.active){
    ctx.shadowColor='#ff8800';
    ctx.shadowBlur=10;
    ctx.fillStyle='#ff8800';
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
  
  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
  
  // Instructions
  ctx.fillStyle=`rgba(255,136,0,${0.5+Math.sin(Date.now()/300)*0.3})`;
  ctx.font='bold 12px Orbitron';
  ctx.fillText('← → to aim, SPACE to hit',10,25);
}

function endInning(){
  gameRunning=false;
  clearInterval(animId);
  
  // AI innings
  const level=LEVELS[currentLevel];
  runsAI=Math.floor(runsYou*0.7+Math.random()*20);
  
  const ov=document.getElementById('ov');
  ov.classList.remove('h');
  const won=runsYou>runsAI;
  ov.querySelector('.ot').textContent=won?'🏏 You Win!':'🤖 AI Wins!';
  ov.querySelector('.os').textContent=`You: ${runsYou} · AI: ${runsAI} · Level ${currentLevel+1}/10`;
  ov.querySelector('.ob').textContent=currentLevel+1<LEVELS.length?'Next Level':'Final Victory!';
  ov.querySelector('.ob').onclick=()=>{
    if(currentLevel+1<LEVELS.length){
      currentLevel++;
      startGame();
    }else{
      location.href='../index.html';
    }
  };
}

function startGame(){
  initGame();
  document.getElementById('ov').classList.add('h');
  document.getElementById('lvlBadge').textContent=`Lv${currentLevel+1}/10`;
  clearInterval(animId);
  animId=setInterval(tick,16);
}

window.addEventListener('resize',()=>{if(!gameRunning)resize();});
resize();
ctx.fillStyle='#001a00';
ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
