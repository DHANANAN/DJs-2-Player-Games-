<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Minigolf — DJ's Games Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--green:#00ff88;
  --panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1rem .8rem;overflow-x:hidden;touch-action:none;}
body::before{content:'';position:fixed;inset:0;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;}
.nav{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.45rem .9rem;letter-spacing:.1em;transition:all .3s;}
.back:hover{color:var(--cyan);border-color:var(--cyan);}
.title{font-family:'Press Start 2P',monospace;font-size:.85rem;color:var(--green);
  text-shadow:0 0 18px rgba(0,255,136,.6);}

/* MODES */
.mode-row{display:flex;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap;justify-content:center;}
.m-btn{
  font-family:'Orbitron',sans-serif;font-size:.58rem;font-weight:700;
  letter-spacing:.1em;padding:.45rem 1rem;background:transparent;color:var(--dim);
  border:1px solid var(--dim);cursor:pointer;transition:all .25s;
}
.m-btn.active{background:var(--green);color:var(--bg);border-color:var(--green);box-shadow:0 0 16px rgba(0,255,136,.4);}
.m-btn.fai.active{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 16px rgba(0,245,255,.4);}
.m-btn.hai.active{background:var(--magenta);border-color:var(--magenta);box-shadow:0 0 16px rgba(255,0,170,.4);}

.hud{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--border);background:var(--panel);padding:.5rem 1.2rem;margin-bottom:.6rem;flex-wrap:wrap;gap:.5rem;}
.hud-val{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;}
.hud-val.p1{color:var(--cyan);}
.hud-val.p2{color:var(--magenta);}
.hud-lbl{font-family:'Orbitron',sans-serif;font-size:.48rem;color:var(--dim);letter-spacing:.12em;}
.hud-block{text-align:center;}

.cw{position:relative;width:min(720px,96vw);border:1px solid var(--border);
  background:#020208;margin-bottom:.6rem;cursor:crosshair;touch-action:none;}
.cw::before{content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,var(--green),var(--gold));z-index:-1;opacity:.4;}
canvas{display:block;width:100%;touch-action:none;}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(4,4,13,.92);z-index:10;padding:1rem;}
.ov.h{display:none;}
.ot{font-family:'Press Start 2P',monospace;font-size:clamp(.85rem,3.5vw,1.5rem);
  color:var(--gold);text-shadow:0 0 28px rgba(255,215,0,.7);text-align:center;margin-bottom:.6rem;}
.os{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--dim);letter-spacing:.12em;margin-bottom:1.4rem;text-align:center;line-height:1.8;}
.ob{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;
  padding:.8rem 2rem;background:var(--green);color:var(--bg);border:none;cursor:pointer;transition:all .25s;}
.ob:hover{background:#fff;}
.hint{font-size:.8rem;color:var(--dim);text-align:center;width:100%;max-width:720px;}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="back">← Hub</a>
  <span class="title">⛳ Minigolf</span>
  <span style="width:70px"></span>
</nav>

<div class="mode-row">
  <button class="m-btn fai active" id="mFAI" onclick="setMode('fai')">💚 vs FAI (Easy Putter)</button>
  <button class="m-btn hai" id="mHAI" onclick="setMode('hai')">🔥 vs HAI (Pro Putter)</button>
  <button class="m-btn" id="m2P" onclick="setMode('2p')">👥 Local 2P</button>
</div>

<div class="hud">
  <div class="hud-block">
    <div class="hud-val p1" id="hP1">P1: 0</div>
    <div class="hud-lbl">Total Strokes</div>
  </div>
  <div class="hud-block">
    <div class="hud-val" style="color:var(--gold)" id="hHole">Hole 1 / 9</div>
    <div class="hud-lbl" id="hTurn">Your Turn</div>
  </div>
  <div class="hud-block">
    <div class="hud-val p2" id="hP2">Bot: 0</div>
    <div class="hud-lbl" id="lblP2Strokes">Bot Strokes</div>
  </div>
</div>

<div class="cw" id="cw">
  <canvas id="c" height="400"></canvas>
  <div class="ov" id="ov">
    <div class="ot">MINI GOLF</div>
    <div class="os">9 challenging holes · Fewest strokes wins<br>Touch &amp; Drag from ball to aim &amp; set power<br>Release to shoot!</div>
    <button class="ob" onclick="startGame()">PLAY GOLF</button>
  </div>
</div>

<p class="hint">🖱️ Click/Drag or 📱 Touch &amp; Drag from the ball backwards to aim. Longer drag = more power!</p>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W, H;

const BALL_R=8;
const HOLE_R=12;
const FRICTION=0.978;

const HOLE_DESIGNS=[
  {ball:[.15,.5], hole:[.85,.5], walls:[{x:.05,y:.15,w:.9,h:.04},{x:.05,y:.81,w:.9,h:.04}], obstacles:[]},
  {ball:[.15,.25], hole:[.82,.75], walls:[{x:.05,y:.15,w:.9,h:.04},{x:.05,y:.81,w:.9,h:.04},{x:.5,y:.15,w:.04,h:.45}], obstacles:[]},
  {ball:[.12,.5], hole:[.85,.5], walls:[{x:.05,y:.15,w:.9,h:.04},{x:.05,y:.81,w:.9,h:.04}], obstacles:[{x:.5,y:.5,r:.08}]},
  {ball:[.12,.5], hole:[.85,.5], walls:[{x:.05,y:.1,w:.9,h:.04},{x:.05,y:.86,w:.9,h:.04},{x:.35,y:.1,w:.04,h:.45},{x:.65,y:.45,w:.04,h:.45}], obstacles:[]},
  {ball:[.12,.25], hole:[.85,.75], walls:[{x:.05,y:.1,w:.9,h:.04},{x:.05,y:.86,w:.9,h:.04}], obstacles:[{x:.38,y:.38,r:.07},{x:.62,y:.62,r:.07}]},
  {ball:[.12,.5], hole:[.85,.5], walls:[{x:.05,y:.1,w:.9,h:.04},{x:.05,y:.86,w:.9,h:.04},{x:.48,y:.1,w:.04,h:.35},{x:.48,y:.55,w:.04,h:.35}], obstacles:[]},
  {ball:[.12,.5], hole:[.85,.5], walls:[{x:.05,y:.1,w:.9,h:.04},{x:.05,y:.86,w:.9,h:.04},{x:.45,y:.1,w:.1,h:.28},{x:.45,y:.62,w:.1,h:.28}], obstacles:[]},
  {ball:[.1,.15], hole:[.88,.82], walls:[{x:.05,y:.1,w:.9,h:.03},{x:.05,y:.87,w:.9,h:.03},{x:.3,y:.1,w:.03,h:.5},{x:.6,y:.4,w:.03,h:.5}], obstacles:[]},
  {ball:[.1,.5], hole:[.88,.5], walls:[{x:.05,y:.1,w:.9,h:.03},{x:.05,y:.87,w:.9,h:.03}], obstacles:[{x:.3,y:.35,r:.06},{x:.5,y:.65,r:.06},{x:.7,y:.35,r:.06}]}
];

let currentHole=0, currentPlayer=0;
let totalStrokes=[0,0];
let holeStrokes=[0,0];
let ball={x:0, y:0, vx:0, vy:0, moving:false, sunk:false};
let holePos={x:0, y:0};
let walls=[], obstacles=[];
let dragging=false, dragStart={x:0,y:0}, mousePos={x:0,y:0};
let animId=null, running=false;
let mode='fai'; // 'fai', 'hai', '2p'

function resize(){
  W=canvas.offsetWidth; H=400;
  canvas.width=W; canvas.height=H;
}

function loadHole(idx){
  const d=HOLE_DESIGNS[idx % HOLE_DESIGNS.length];
  ball.x = d.ball[0]*W; ball.y = d.ball[1]*H;
  ball.vx=0; ball.vy=0; ball.moving=false; ball.sunk=false;
  holePos = {x:d.hole[0]*W, y:d.hole[1]*H};

  walls = d.walls.map(w=>({x:w.x*W, y:w.y*H, w:w.w*W, h:w.h*H}));
  obstacles = d.obstacles.map(o=>({x:o.x*W, y:o.y*H, r:o.r*W}));

  document.getElementById('hHole').textContent = `Hole ${idx+1} / 9`;
  updateHUD();
}

function updateHUD(){
  document.getElementById('hP1').textContent = `P1: ${totalStrokes[0]}`;
  document.getElementById('hP2').textContent = `P2/Bot: ${totalStrokes[1]}`;
  const isP1 = currentPlayer===0;
  document.getElementById('hTurn').textContent = isP1 ? 'Your Turn' : (mode==='2p'?'P2 Turn':'Bot Putting...');
  document.getElementById('hTurn').style.color = isP1 ? 'var(--cyan)' : 'var(--magenta)';
}

// ── Touch & Mouse Putting ──
canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('touchstart', e=>{
  if(e.touches[0]) handleStart(e.touches[0]);
},{passive:false});

window.addEventListener('mousemove', handleMove);
window.addEventListener('touchmove', e=>{
  if(e.touches[0]){ e.preventDefault(); handleMove(e.touches[0]); }
},{passive:false});

window.addEventListener('mouseup', handleEnd);
window.addEventListener('touchend', handleEnd);

function handleStart(e){
  if(!running || ball.moving || ball.sunk) return;
  if(currentPlayer===1 && mode!=='2p') return; // AI turn

  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width);
  const my=(e.clientY-r.top)*(H/r.height);

  if(Math.hypot(mx-ball.x, my-ball.y) < 45){
    dragging=true;
    dragStart={x:ball.x, y:ball.y};
    mousePos={x:mx, y:my};
  }
}

function handleMove(e){
  if(!dragging) return;
  const r=canvas.getBoundingClientRect();
  mousePos.x=(e.clientX-r.left)*(W/r.width);
  mousePos.y=(e.clientY-r.top)*(H/r.height);
}

function handleEnd(){
  if(!dragging) return;
  dragging=false;
  const dx = ball.x - mousePos.x;
  const dy = ball.y - mousePos.y;
  const dist = Math.hypot(dx,dy);
  if(dist > 6){
    const power = Math.min(dist * 0.14, 15);
    ball.vx = (dx / dist) * power;
    ball.vy = (dy / dist) * power;
    ball.moving = true;
    totalStrokes[currentPlayer]++;
    holeStrokes[currentPlayer]++;
    updateHUD();
  }
}

function triggerAIPut(){
  if(!running || ball.moving || ball.sunk) return;
  setTimeout(()=>{
    const dx = holePos.x - ball.x;
    const dy = holePos.y - ball.y;
    let angle = Math.atan2(dy, dx);
    const dist = Math.hypot(dx, dy);

    if(mode==='fai'){
      // FAI: Friendly AI with casual spread
      angle += (Math.random()-0.5)*0.35;
      const power = Math.min(dist * 0.045 + Math.random()*2, 11);
      ball.vx = Math.cos(angle)*power;
      ball.vy = Math.sin(angle)*power;
    } else {
      // HAI: Calculated direct put
      const power = Math.min(dist * 0.038 + 2.5, 13);
      ball.vx = Math.cos(angle)*power;
      ball.vy = Math.sin(angle)*power;
    }
    ball.moving=true;
    totalStrokes[1]++;
    holeStrokes[1]++;
    updateHUD();
  }, 900);
}

function update(){
  if(!running) return;

  if(ball.moving){
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;

    if(Math.hypot(ball.vx, ball.vy) < 0.08){
      ball.vx=0; ball.vy=0;
      ball.moving=false;
      onPuttStop();
    }

    // Outer boundary walls
    if(ball.x - BALL_R < 10){ ball.x = 10 + BALL_R; ball.vx = Math.abs(ball.vx)*0.75; }
    if(ball.x + BALL_R > W-10){ ball.x = W - 10 - BALL_R; ball.vx = -Math.abs(ball.vx)*0.75; }
    if(ball.y - BALL_R < 10){ ball.y = 10 + BALL_R; ball.vy = Math.abs(ball.vy)*0.75; }
    if(ball.y + BALL_R > H-10){ ball.y = H - 10 - BALL_R; ball.vy = -Math.abs(ball.vy)*0.75; }

    // Obstacle walls
    walls.forEach(w=>{
      if(ball.x + BALL_R > w.x && ball.x - BALL_R < w.x + w.w &&
         ball.y + BALL_R > w.y && ball.y - BALL_R < w.y + w.h){
        // Simple bounce
        ball.vx *= -0.75;
        ball.vy *= -0.75;
      }
    });

    // Circular obstacles
    obstacles.forEach(o=>{
      const dx = ball.x - o.x, dy = ball.y - o.y;
      const dist = Math.hypot(dx,dy);
      if(dist < BALL_R + o.r && dist > 0){
        const nx = dx / dist, ny = dy / dist;
        ball.x = o.x + nx * (BALL_R + o.r);
        ball.y = o.y + ny * (BALL_R + o.r);
        const dot = ball.vx * nx + ball.vy * ny;
        ball.vx -= 1.6 * dot * nx;
        ball.vy -= 1.6 * dot * ny;
      }
    });

    // Hole check
    if(Math.hypot(ball.x - holePos.x, ball.y - holePos.y) < HOLE_R){
      ball.sunk=true; ball.vx=0; ball.vy=0; ball.moving=false;
      onHoleSunk();
    }
  }
}

function onPuttStop(){
  if(!ball.sunk){
    // Switch turn
    currentPlayer = currentPlayer===0 ? 1 : 0;
    updateHUD();
    if(currentPlayer===1 && mode!=='2p') triggerAIPut();
  }
}

function onHoleSunk(){
  if(currentHole < 8){
    currentHole++;
    setTimeout(()=>{
      loadHole(currentHole);
      currentPlayer = 0;
      updateHUD();
    }, 1000);
  } else {
    endGame();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#020208'; ctx.fillRect(0,0,W,H);

  // Putting Green
  ctx.fillStyle='#0a3d1c';
  ctx.fillRect(10, 10, W-20, H-20);
  ctx.strokeStyle='#1a6b35'; ctx.lineWidth=4;
  ctx.strokeRect(10, 10, W-20, H-20);

  // Obstacle walls
  ctx.fillStyle='#607080';
  walls.forEach(w=>{
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle='#8090a0'; ctx.lineWidth=2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  });

  // Obstacles circles
  obstacles.forEach(o=>{
    ctx.fillStyle='#7f8c8d';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#bdc3c7'; ctx.lineWidth=3; ctx.stroke();
  });

  // Hole
  ctx.fillStyle='#04040d';
  ctx.beginPath(); ctx.arc(holePos.x, holePos.y, HOLE_R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.stroke();

  // Flag pin
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(holePos.x, holePos.y); ctx.lineTo(holePos.x, holePos.y-25); ctx.stroke();
  ctx.fillStyle='#ff0033';
  ctx.beginPath(); ctx.moveTo(holePos.x, holePos.y-25); ctx.lineTo(holePos.x+12, holePos.y-20); ctx.lineTo(holePos.x, holePos.y-15); ctx.fill();

  // Aiming Guide Line
  if(dragging && !ball.sunk){
    const dx = ball.x - mousePos.x;
    const dy = ball.y - mousePos.y;
    const dist = Math.hypot(dx,dy);
    if(dist > 5){
      ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(ball.x, ball.y);
      ctx.lineTo(ball.x + (dx/dist)*140, ball.y + (dy/dist)*140);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Draw Ball
  if(!ball.sunk){
    const ballCol = currentPlayer===0 ? '#00f5ff' : '#ff00aa';
    ctx.shadowColor=ballCol; ctx.shadowBlur=12;
    ctx.fillStyle=ballCol;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(ball.x-2, ball.y-2, 2.5, 0, Math.PI*2); ctx.fill();
  }
}

function loop(){
  update();
  draw();
  if(running) animId=requestAnimationFrame(loop);
}

function startGame(){
  resize();
  currentHole=0; currentPlayer=0;
  totalStrokes=[0,0]; holeStrokes=[0,0];
  document.getElementById('ov').classList.add('h');
  loadHole(0);
  running=true;
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function endGame(){
  running=false;
  cancelAnimationFrame(animId);
  const ov=document.getElementById('ov');
  ov.classList.remove('h');
  const youWon = totalStrokes[0] <= totalStrokes[1];
  ov.querySelector('.ot').textContent = youWon ? '🏆 CHAMPION GOLFER!' : '🤖 BOT TOOK THE TROPHY!';
  ov.querySelector('.os').textContent = `Total Strokes: You (${totalStrokes[0]}) — Bot (${totalStrokes[1]})`;
  ov.querySelector('.ob').textContent = 'PLAY AGAIN';
}

function setMode(m){
  mode=m;
  document.getElementById('mFAI').classList.toggle('active',m==='fai');
  document.getElementById('mHAI').classList.toggle('active',m==='hai');
  document.getElementById('m2P').classList.toggle('active',m==='2p');
}

window.addEventListener('resize',()=>{ if(running) resize(); });
resize();
ctx.fillStyle='#020208'; ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
