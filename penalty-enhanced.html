<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Penalty Kicks — DJ's Games Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--green:#00ff88;
  --panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.2rem 1rem;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;}
.nav{width:100%;max-width:700px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.45rem .9rem;letter-spacing:.1em;transition:all .3s;}
.back:hover{color:var(--cyan);border-color:var(--cyan);}
.title{font-family:'Press Start 2P',monospace;font-size:.8rem;color:var(--green);
  text-shadow:0 0 18px rgba(0,255,136,.6);}
.controls{display:flex;gap:.6rem;align-items:center;font-size:.5rem;font-family:Orbitron,sans-serif;}
.level-badge{color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,.6);}
#difficultySelect{padding:.3rem .6rem;background:#020208;color:var(--cyan);border:1px solid var(--cyan);
  font-family:Orbitron,sans-serif;font-size:.45rem;cursor:pointer;transition:all .2s;}
#difficultySelect:hover{box-shadow:0 0 12px rgba(0,245,255,.4);}
.scoreboard{width:100%;max-width:700px;display:grid;grid-template-columns:1fr auto 1fr;
  margin-bottom:.8rem;}
.sb{text-align:center;padding:.6rem;border:1px solid var(--border);background:var(--panel);}
.sb+.sb{border-left:none;}
.sn{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;}
.sn.p1{color:var(--cyan);}
.sn.p2{color:var(--magenta);}
.sl{font-family:'Orbitron',sans-serif;font-size:.5rem;color:var(--dim);letter-spacing:.12em;}
.kicks-row{font-size:.9rem;margin-top:.3rem;letter-spacing:.1em;color:var(--gold);}
.cw{position:relative;width:min(700px,96vw);border:1px solid var(--border);
  background:#020208;margin-bottom:.8rem;overflow:hidden;}
.cw::before{content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,var(--green),var(--cyan));z-index:-1;opacity:.35;}
canvas{display:block;width:100%;}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(4,4,13,.92);z-index:10;}
.ov.h{display:none;}
.ot{font-family:'Press Start 2P',monospace;font-size:clamp(.85rem,3.5vw,1.5rem);
  color:var(--gold);text-shadow:0 0 28px rgba(255,215,0,.7);text-align:center;margin-bottom:.6rem;}
.os{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--dim);letter-spacing:.12em;margin-bottom:1.4rem;text-align:center;line-height:1.8;}
.ob{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;
  padding:.8rem 2rem;background:var(--green);color:var(--bg);border:none;cursor:pointer;transition:all .25s;}
.ob:hover{background:#fff;transform:scale(1.05);}
.instr{width:100%;max-width:700px;border:1px solid var(--border);
  background:var(--panel);padding:.8rem 1.2rem;font-size:.85rem;color:var(--dim);
  font-weight:300;line-height:1.8;text-align:center;}
.instr b{color:var(--cyan);font-weight:600;}
</style>
</head>
<body>
<nav class="nav">
   <a href="../index.html" class="back">← Hub</a>
   <span class="title">Penalty Kicks</span>
   <div class="controls">
     <span class="level-badge" id="lvlBadge">Lv1/10</span>
     <select id="difficultySelect" onchange="changeDifficulty(this.value)">
       <option value="rookie">Rookie</option>
       <option value="amateur">Amateur</option>
       <option value="intermediate" selected>Intermediate</option>
       <option value="advanced">Advanced</option>
       <option value="expert">Expert</option>
     </select>
   </div>
</nav>

<div class="scoreboard">
   <div class="sb">
     <div class="sn p1" id="s1">0</div>
     <div class="sl">Player 1</div>
     <div class="kicks-row" id="k1">○○○○○</div>
   </div>
   <div class="sb">
     <div class="sn" style="color:var(--dim)">VS</div>
     <div class="sl">5 kicks each</div>
     <div class="kicks-row" id="rd" style="color:var(--gold)">Round 1</div>
   </div>
   <div class="sb">
     <div class="sn p2" id="s2">0</div>
     <div class="sl">Player 2</div>
     <div class="kicks-row" id="k2">○○○○○</div>
   </div>
</div>

<div class="cw">
   <canvas id="c" height="420"></canvas>
   <div class="ov" id="ov">
     <div class="ot">PENALTY KICKS</div>
     <div class="os" id="ovText">5 kicks per player · Most goals wins<br>Shooter: click to aim &amp; power<br>Goalkeeper: click to dive left or right</div>
     <button class="ob" onclick="startGame()">KICK OFF</button>
   </div>
</div>

<div class="instr" id="instr">
   <b>Waiting to start...</b>
</div>

<script>
/* ─── PENALTY KICKS ENHANCED ────────────────────────────────
   Features:
   - 10 difficulty levels with escalating challenge
   - 5 AI difficulty tiers (Rookie→Expert)
   - Pattern-based goalkeeper AI
   - Progressive keeper speed & accuracy
   - Particle effects & animations
──────────────────────────────────────────────────────────── */

const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H;

// LEVEL & AI CONFIG
const LEVELS=[
  {kicks:5, goalWidth:1.0, keeperSpeed:0.05, accuracy:0.50},  // Lv1: Easy
  {kicks:5, goalWidth:0.95, keeperSpeed:0.06, accuracy:0.55},
  {kicks:5, goalWidth:0.90, keeperSpeed:0.07, accuracy:0.60},
  {kicks:5, goalWidth:0.85, keeperSpeed:0.08, accuracy:0.65},
  {kicks:5, goalWidth:0.80, keeperSpeed:0.09, accuracy:0.70},  // Lv5: Medium
  {kicks:5, goalWidth:0.75, keeperSpeed:0.10, accuracy:0.75},
  {kicks:5, goalWidth:0.70, keeperSpeed:0.11, accuracy:0.80},
  {kicks:5, goalWidth:0.65, keeperSpeed:0.12, accuracy:0.85},
  {kicks:5, goalWidth:0.60, keeperSpeed:0.13, accuracy:0.88},
  {kicks:5, goalWidth:0.55, keeperSpeed:0.14, accuracy:0.90}   // Lv10: Expert
];

const AI_TIERS={
  rookie:   {predict:0.30, react:0.40},
  amateur:  {predict:0.50, react:0.60},
  intermediate:{predict:0.70, react:0.75},
  advanced: {predict:0.85, react:0.88},
  expert:   {predict:0.95, react:0.95}
};

let currentLevel=0;
let aiDifficulty='intermediate';
let particles=[];

const game={
  kicks:[],
  currentKick:0,
  scores:[0,0],
  phase:'idle',
  shooter:0,
  charge:0,
  charging:false,
  aimX:0, aimY:0,
  diveDir:0,
  ball:{x:0,y:0,tx:0,ty:0,prog:0},
  keeper:{x:0,offset:0},
  goalFlash:0,
  result:'',
  winner:-1,
  kickHistory:[]
};

let animId=null;
let mouseX=0, mouseY=0;
let chargeInterval=null;

function resize(){
  W=canvas.offsetWidth; H=420;
  canvas.width=W; canvas.height=H;
}

function getGoal(){
  const level=LEVELS[currentLevel];
  const baseW=W*.50;
  const gW=baseW*level.goalWidth;
  const gH=H*.35;
  const gX=(W-gW)/2, gY=H*.12;
  return{x:gX,y:gY,w:gW,h:gH};
}

function getBallPos(){return{x:W/2,y:H*.82};}
function getKeeperY(){const g=getGoal();return g.y+g.h;}

function changeDifficulty(val){
  aiDifficulty=val;
  document.getElementById('difficultySelect').value=val;
}

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
  mouseY=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('mousedown',onCanvasClick);
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  mouseX=(e.touches[0].clientX-r.left)*(W/r.width);
  mouseY=(e.touches[0].clientY-r.top)*(H/r.height);
  onCanvasClick(e);
},{passive:false});

function onCanvasClick(e){
  if(game.phase==='aim'){
    const g=getGoal();
    game.aimX=Math.max(g.x+10,Math.min(g.x+g.w-10, mouseX));
    game.aimY=Math.max(g.y+5, Math.min(g.y+g.h-5, mouseY));
    game.phase='charge';
    game.charge=0;
    setInstr(`<b>P${game.shooter+1} charging...</b> Click again to shoot!`);
  } else if(game.phase==='charge'){
    game.phase='dive';
    clearInterval(chargeInterval);
    setInstr(`<b>P${2-game.shooter} (Goalkeeper):</b> Click LEFT or RIGHT to dive!`);
  } else if(game.phase==='dive'){
    // AI keeper reaction (if P1 shoots)
    if(game.shooter===0){
      const aiTier=AI_TIERS[aiDifficulty];
      const shouldAiDive=Math.random()<aiTier.react;
      if(shouldAiDive){
        // AI tries to predict
        const g=getGoal();
        const shotDist=Math.abs(game.aimX-g.x-g.w/2);
        const centerDist=Math.abs(mouseX-W/2);
        const canPredict=Math.random()<aiTier.predict;
        if(canPredict&&shotDist>g.w*.15){
          game.diveDir=game.aimX<g.x+g.w/2?-1:1;
        } else {
          game.diveDir=Math.random()>0.5?1:-1;
        }
      } else {
        game.diveDir=0;
      }
    } else {
      game.diveDir=mouseX<W/2?-1:1;
    }
    animateKick();
  }
}

function setInstr(txt){document.getElementById('instr').innerHTML=txt;}

function startGame(){
  resize();
  currentLevel=parseInt(document.getElementById('lvlBadge').textContent.match(/\d+/)[0])-1;
  const kicksPerPlayer=LEVELS[currentLevel].kicks;
  game={kicks:[],currentKick:0,scores:[0,0],phase:'idle',shooter:0,
    charge:0,charging:false,aimX:W/2,aimY:0,diveDir:0,
    ball:{x:0,y:0,tx:0,ty:0,prog:0},keeper:{x:0,offset:0},goalFlash:0,result:'',winner:-1,kickHistory:[]};
  document.getElementById('ov').classList.add('h');
  if(animId)cancelAnimationFrame(animId);
  updateScoreDisplay();
  nextKick();
  animId=requestAnimationFrame(loop);
}

function nextKick(){
  const kicksPerPlayer=LEVELS[currentLevel].kicks;
  if(game.currentKick>=kicksPerPlayer*2){
    endLevel();return;
  }
  game.shooter=game.currentKick%2;
  const g=getGoal();
  const bp=getBallPos();
  game.ball={x:bp.x,y:bp.y,tx:W/2,ty:g.y+g.h/2,prog:0};
  game.keeper={x:W/2,offset:0};
  game.phase='aim';
  game.charge=0;
  game.diveDir=0;
  game.result='';
  game.goalFlash=0;
  setInstr(`<b>P${game.shooter+1} shooting</b> → Move mouse over goal to aim, then <b>click to lock aim</b>.`);
  document.getElementById('rd').textContent=`Kick ${game.currentKick+1}/${kicksPerPlayer*2}`;
  startChargeAnim();
}

let chargeDir=1;
function startChargeAnim(){
  clearInterval(chargeInterval);
  chargeInterval=setInterval(()=>{
    if(game.phase!=='charge')return;
    game.charge+=chargeDir*.025;
    if(game.charge>=1){game.charge=1;chargeDir=-1;}
    if(game.charge<=0){game.charge=0;chargeDir=1;}
  },30);
}

function animateKick(){
  const g=getGoal();
  const level=LEVELS[currentLevel];
  game.ball.tx=game.aimX;
  game.ball.ty=game.aimY;
  game.ball.prog=0;
  game.phase='animate';

  const diveTarget=game.diveDir*g.w*.38;
  const diveSpeed=level.keeperSpeed;
  const power=.4+game.charge*.6;
  let progress=0;

  const anim=()=>{
    progress+=.04*power;
    game.keeper.offset+=(diveTarget-game.keeper.offset)*diveSpeed*3;

    const bp=getBallPos();
    game.ball.x=bp.x+(game.ball.tx-bp.x)*progress;
    game.ball.y=bp.y+(game.ball.ty-bp.y)*progress;
    game.ball.prog=progress;

    // Particles on ball trajectory
    if(progress%0.1<0.04){
      particles.push({
        x:game.ball.x+Math.random()*8-4,
        y:game.ball.y+Math.random()*8-4,
        vx:Math.random()*.5-0.25,
        vy:Math.random()*.5-0.25,
        life:1,
        size:Math.random()*3+1
      });
    }

    if(progress>=1){
      const keeperX=W/2+game.keeper.offset;
      const keeperReach=g.w*.28*level.accuracy;
      const dist=Math.abs(game.ball.tx-keeperX);
      const inHeightRange=Math.abs(game.ball.ty-getKeeperY())<50;
      const saved=dist<keeperReach&&inHeightRange;
      game.result=saved?'SAVED!':'GOAL!';
      game.goalFlash=saved?0:1;
      if(!saved){
        game.scores[game.shooter]++;
        createExplosion(game.ball.tx,game.ball.ty,'goal');
        updateScoreDisplay();
      } else {
        createExplosion(keeperX,getKeeperY(),'save');
      }
      game.kickHistory.push({shooter:game.shooter,saved});
      game.phase='result';
      clearInterval(chargeInterval);
      setTimeout(()=>{
        game.currentKick++;
        nextKick();
      },1800);
      return;
    }
    requestAnimationFrame(anim);
  };
  requestAnimationFrame(anim);
}

function createExplosion(x,y,type){
  const count=type==='goal'?15:10;
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*3+2;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      size:Math.random()*4+2,
      color:type==='goal'?'#ffd700':'#ff00aa'
    });
  }
}

function updateParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.1; // gravity
    p.life-=0.03;
    return p.life>0;
  });
}

function endLevel(){
  game.phase='idle';
  const ov=document.getElementById('ov');
  ov.classList.remove('h');
  const [s1,s2]=game.scores;
  let title,sub;
  if(s1>s2){title='🏆 Player 1 Wins!';sub=`${s1} – ${s2}`;}
  else if(s2>s1){title='🏆 Player 2 Wins!';sub=`${s1} – ${s2}`;}
  else{title='DRAW!';sub=`${s1} – ${s2}`;}
  ov.querySelector('.ot').textContent=title;
  ov.querySelector('.os').textContent=sub+' · Level '+currentLevel+1+' / 10';
  ov.querySelector('.ob').textContent=currentLevel+1<10?'Next Level':'Final Victory!';
  ov.querySelector('.ob').onclick=()=>{
    if(currentLevel+1<LEVELS.length){
      currentLevel++;
      document.getElementById('lvlBadge').textContent='Lv'+(currentLevel+1)+'/10';
    }
    startGame();
  };
  game.winner=s1>s2?0:s2>s1?1:-1;
}

function updateScoreDisplay(){
  document.getElementById('s1').textContent=game.scores[0];
  document.getElementById('s2').textContent=game.scores[1];
  const kicksPerPlayer=LEVELS[currentLevel].kicks;
  const makeKicks=(playerIdx)=>{
    let str='';
    for(let i=0;i<kicksPerPlayer;i++){
      const kick=game.kickHistory.find(k=>k.shooter===playerIdx&&game.kickHistory.indexOf(k)===i);
      if(i<game.kickHistory.filter(k=>k.shooter===playerIdx).length){
        str+=game.kickHistory.filter(k=>k.shooter===playerIdx)[i].saved?'✗':'⚽';
      } else str+='○';
    }
    return str;
  };
  document.getElementById('k1').textContent=makeKicks(0);
  document.getElementById('k2').textContent=makeKicks(1);
}

function drawGoal(g){
  ctx.fillStyle='#0a2e0a'; ctx.fillRect(0,H*.5,W,H);
  ctx.beginPath();ctx.arc(W/2,getBallPos().y-10,4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(W/2,getBallPos().y,H*.22,Math.PI,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=3;
  ctx.strokeRect(g.x,g.y,g.w,g.h);
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=.5;
  const netCols=10, netRows=6;
  for(let i=1;i<netCols;i++){
    ctx.beginPath(); ctx.moveTo(g.x+i*g.w/netCols,g.y); ctx.lineTo(g.x+i*g.w/netCols,g.y+g.h); ctx.stroke();
  }
  for(let i=1;i<netRows;i++){
    ctx.beginPath(); ctx.moveTo(g.x,g.y+i*g.h/netRows); ctx.lineTo(g.x+g.w,g.y+i*g.h/netRows); ctx.stroke();
  }
}

function drawKeeper(g){
  const kx=W/2+game.keeper.offset;
  const ky=getKeeperY();
  const level=LEVELS[currentLevel];
  const speedGlow=Math.min(level.keeperSpeed*50, 1);
  ctx.shadowColor=game.shooter===0?'#ff00aa':'#00f5ff';
  ctx.shadowBlur=Math.floor(15+speedGlow*10);
  ctx.fillStyle='#222';
  ctx.fillRect(kx-14,ky-30,10,30);
  ctx.fillRect(kx+4,ky-30,10,30);
  ctx.fillStyle=game.shooter===0?'#ff00aa':'#00f5ff';
  ctx.fillRect(kx-16,ky-60,32,35);
  ctx.beginPath(); ctx.arc(kx,ky-70,14,0,Math.PI*2);
  ctx.fillStyle='#d4a57a'; ctx.fill();
  if(game.phase==='animate'||game.phase==='result'){
    const armAngle=game.diveDir*(Math.PI*.45);
    ctx.strokeStyle=game.shooter===0?'#ff00aa':'#00f5ff'; ctx.lineWidth=8;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(kx,ky-50);
    ctx.lineTo(kx+Math.cos(armAngle)*45, ky-50+Math.sin(armAngle)*20);
    ctx.stroke();
  }
  ctx.shadowBlur=0;
}

function drawShooter(){
  const bp=getBallPos();
  const sx=W/2;
  ctx.fillStyle=game.shooter===0?'rgba(0,245,255,.7)':'rgba(255,0,170,.7)';
  ctx.shadowColor=game.shooter===0?'#00f5ff':'#ff00aa'; ctx.shadowBlur=12;
  ctx.fillStyle='#222';
  ctx.fillRect(sx-10,bp.y-32,8,30);
  ctx.fillRect(sx+2,bp.y-32,8,30);
  ctx.fillStyle=game.shooter===0?'#00f5ff':'#ff00aa';
  ctx.fillRect(sx-14,bp.y-62,28,34);
  ctx.beginPath(); ctx.arc(sx,bp.y-72,12,0,Math.PI*2);
  ctx.fillStyle='#d4a57a'; ctx.fill();
  ctx.shadowBlur=0;
}

function drawBall(){
  const bx=game.ball.x, by=game.ball.y;
  const scale=1-game.ball.prog*.4;
  const r=12*scale;
  ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.fill();
  ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.stroke();
}

function drawAimCursor(g){
  if(game.phase!=='aim')return;
  const ax=Math.max(g.x+10,Math.min(g.x+g.w-10,mouseX));
  const ay=Math.max(g.y+5,Math.min(g.y+g.h-5,mouseY));
  ctx.strokeStyle='rgba(255,215,0,.8)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(ax-12,ay); ctx.lineTo(ax+12,ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax,ay-12); ctx.lineTo(ax,ay+12); ctx.stroke();
  ctx.beginPath(); ctx.arc(ax,ay,6,0,Math.PI*2); ctx.stroke();
  const bp=getBallPos();
  ctx.strokeStyle='rgba(255,215,0,.2)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(bp.x,bp.y); ctx.lineTo(ax,ay); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPowerBar(){
  if(game.phase!=='charge')return;
  const bx=20,by=H-30,bw=W-40,bh=14;
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(bx,by,bw,bh);
  const pwr=game.charge;
  const c=pwr<.5?`rgba(0,255,136,${.7+pwr*.3})`:`rgba(255,${Math.floor(255*(1-pwr))},0,.9)`;
  ctx.fillStyle=c; ctx.fillRect(bx,by,bw*pwr,bh);
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff'; ctx.font='bold 9px Orbitron,sans-serif'; ctx.textAlign='center';
  ctx.fillText('CLICK TO SHOOT',W/2,by+10);
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color||'rgba(0,255,136,.8)';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawResult(){
  if(!game.result)return;
  const col=game.result==='GOAL!'?'#ffd700':'#ff4455';
  ctx.fillStyle=col;
  ctx.font=`bold clamp(1.5rem,5vw,2.5rem) 'Press Start 2P',monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillText(game.result,W/2,H*.52);
  ctx.shadowBlur=0;
  if(game.result==='GOAL!'){
    ctx.fillStyle='rgba(255,215,0,.06)';
    ctx.fillRect(0,0,W,H);
  }
}

function drawGoalFlash(){
  if(game.goalFlash>0){
    ctx.fillStyle=`rgba(255,215,0,${game.goalFlash*.1})`;
    ctx.fillRect(0,0,W,H);
    game.goalFlash*=.9;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#04060a'; ctx.fillRect(0,0,W,H);

  const g=getGoal();
  const sky=ctx.createLinearGradient(0,0,0,H*.5);
  sky.addColorStop(0,'#030e1a'); sky.addColorStop(1,'#061a08');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*.5);

  drawGoal(g);
  drawGoalFlash();
  drawKeeper(g);
  drawShooter();
  if(game.phase!=='idle') drawBall();
  drawParticles();
  drawAimCursor(g);
  drawPowerBar();

  if(game.phase==='dive'){
    ctx.fillStyle='rgba(0,245,255,.06)'; ctx.fillRect(0,0,W/2,H);
    ctx.fillStyle='rgba(255,0,170,.06)'; ctx.fillRect(W/2,0,W/2,H);
    ctx.fillStyle='rgba(0,245,255,.5)'; ctx.textAlign='left';
    ctx.font='bold 11px Orbitron,sans-serif';
    ctx.fillText('← DIVE LEFT',14,H/2);
    ctx.fillStyle='rgba(255,0,170,.5)'; ctx.textAlign='right';
    ctx.fillText('DIVE RIGHT →',W-14,H/2);
  }

  drawResult();
}

function loop(){
  updateParticles();
  draw();
  animId=requestAnimationFrame(loop);
}

window.addEventListener('resize',()=>{resize();});
resize();
</script>
</body>
</html>
