<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong — DJ's Games Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04040d; --cyan: #00f5ff; --magenta: #ff00aa;
      --gold: #ffd700; --green: #00ff88; --red: #ff4455;
      --panel: rgba(0,245,255,0.04); --border: rgba(0,245,255,0.18);
      --text: #c8d8ff; --dim: #5a6a8a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 1.5rem 1rem; overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 999;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      pointer-events: none;
    }

    .top-nav {
      width: 100%; max-width: 700px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
    }
    .back {
      font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 700;
      color: var(--dim); text-decoration: none; border: 1px solid var(--dim);
      padding: 0.5rem 1rem; letter-spacing: 0.1em; transition: all 0.3s;
    }
    .back:hover { color: var(--cyan); border-color: var(--cyan); }
    .game-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem; color: var(--magenta);
      text-shadow: 0 0 20px rgba(255,0,170,0.6);
    }
    .level-info {
      display: flex; gap: 0.6rem; align-items: center; font-size: 0.5rem; font-family: 'Orbitron', sans-serif;
      color: var(--gold); text-shadow: 0 0 8px rgba(255,215,0,0.6);
    }

    /* MODE ROW */
    .mode-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
    .mode-btn {
      font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.12em; padding: 0.55rem 1.3rem;
      background: transparent; color: var(--dim);
      border: 1px solid var(--dim); cursor: pointer; transition: all 0.25s;
    }
    .mode-btn.active {
      color: var(--bg); background: var(--magenta);
      border-color: var(--magenta);
      box-shadow: 0 0 20px rgba(255,0,170,0.4);
    }

    /* SCORE STRIP */
    .score-strip {
      width: 100%; max-width: 700px;
      display: grid; grid-template-columns: 1fr auto 1fr;
      margin-bottom: 1rem;
    }
    .score-box { text-align: center; padding: 0.6rem; border: 1px solid var(--border); background: var(--panel); }
    .score-box + .score-box { border-left: none; }
    .score-val { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; }
    .score-val.p1 { color: var(--cyan); text-shadow: 0 0 16px rgba(0,245,255,0.5); }
    .score-val.p2 { color: var(--magenta); text-shadow: 0 0 16px rgba(255,0,170,0.5); }
    .score-val.sep { color: var(--dim); }
    .score-lbl { font-family: 'Orbitron', sans-serif; font-size: 0.5rem; color: var(--dim); letter-spacing: 0.12em; }

    /* CANVAS WRAP */
    .canvas-wrap {
      position: relative;
      width: min(700px, 96vw);
      border: 1px solid var(--border);
      background: #020208;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .canvas-wrap::before {
      content: '';
      position: absolute; inset: -2px;
      background: linear-gradient(90deg, var(--magenta), var(--cyan), var(--magenta));
      z-index: -1; opacity: 0.4;
    }
    canvas { display: block; width: 100%; }

    /* OVERLAY */
    .game-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(4,4,13,0.85); z-index: 10;
    }
    .game-overlay.hidden { display: none; }
    .overlay-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1rem, 4vw, 1.8rem);
      color: var(--gold); text-align: center;
      text-shadow: 0 0 30px rgba(255,215,0,0.7);
      margin-bottom: 0.8rem;
    }
    .overlay-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem; color: var(--dim);
      letter-spacing: 0.15em; margin-bottom: 1.8rem;
    }
    .overlay-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.2em; padding: 0.9rem 2.2rem;
      background: var(--cyan); color: var(--bg); border: none; cursor: pointer;
      box-shadow: 0 0 24px rgba(0,245,255,0.5); transition: all 0.25s;
    }
    .overlay-btn:hover { background: #fff; box-shadow: 0 0 40px rgba(0,245,255,0.8); }

    /* CONTROLS INFO */
    .controls-panel {
      width: 100%; max-width: 700px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem; margin-bottom: 1rem;
    }
    .ctrl-box { border: 1px solid var(--border); background: var(--panel); padding: 1rem 1.2rem; }
    .ctrl-box h4 {
      font-family: 'Orbitron', sans-serif; font-size: 0.6rem;
      color: var(--cyan); letter-spacing: 0.15em; margin-bottom: 0.6rem;
    }
    .ctrl-box p { font-size: 0.85rem; color: var(--dim); line-height: 1.7; font-weight: 300; }
    .key {
      display: inline-block; font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem; padding: 0.1rem 0.4rem;
      border: 1px solid var(--border); color: var(--text);
      background: rgba(255,255,255,0.05);
    }

    @media (max-width: 500px) {
      .controls-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="../index.html" class="back">← Hub</a>
  <span class="game-title">Ping Pong</span>
  <div class="level-info" id="levelInfo">Lv1/10</div>
</nav>

<!-- MODE -->
<div class="mode-row">
  <button class="mode-btn active" id="btn2p" onclick="setMode('2p')">👥 2 Player</button>
  <button class="mode-btn" id="btnAI" onclick="setMode('ai')">🤖 vs AI</button>
</div>

<!-- SCOREBOARD -->
<div class="score-strip">
  <div class="score-box">
    <div class="score-val p1" id="s1">0</div>
    <div class="score-lbl" id="lbl1">Player 1</div>
  </div>
  <div class="score-box">
    <div class="score-val sep">—</div>
    <div class="score-lbl" id="winTarget">First to 7</div>
  </div>
  <div class="score-box">
    <div class="score-val p2" id="s2">0</div>
    <div class="score-lbl" id="lbl2">Player 2</div>
  </div>
</div>

<!-- CANVAS -->
<div class="canvas-wrap">
  <canvas id="pong" height="400"></canvas>
  <div class="game-overlay" id="overlay">
    <div class="overlay-title" id="overlayTitle">PING PONG</div>
    <div class="overlay-sub" id="overlaySub">Press Start to play</div>
    <button class="overlay-btn" id="overlayBtn" onclick="startGame()">START GAME</button>
  </div>
</div>

<!-- CONTROLS INFO -->
<div class="controls-panel">
  <div class="ctrl-box">
    <h4>// Player 1 (Left)</h4>
    <p><span class="key">W</span> Move Up &nbsp; <span class="key">S</span> Move Down</p>
  </div>
  <div class="ctrl-box" id="ctrl2">
    <h4>// Player 2 (Right)</h4>
    <p><span class="key">↑</span> Move Up &nbsp; <span class="key">↓</span> Move Down</p>
  </div>
</div>

<script>
/* PING PONG ENHANCED
   - 10 difficulty levels with escalating challenge
   - Power-ups: Slow-mo, Spin Boost, Freeze Opponent
   - Progressive AI difficulty
*/

const canvas = document.getElementById('pong');
const ctx    = canvas.getContext('2d');
let W, H;

const LEVELS = [
  {winScore:7, speed:4, paddle:{h:80,speed:6}, aiPredictionErr:0.4, spawnRate:0},
  {winScore:7, speed:4.3, paddle:{h:78,speed:6.3}, aiPredictionErr:0.35, spawnRate:0.03},
  {winScore:7, speed:4.6, paddle:{h:76,speed:6.6}, aiPredictionErr:0.30, spawnRate:0.05},
  {winScore:6, speed:4.9, paddle:{h:74,speed:6.9}, aiPredictionErr:0.25, spawnRate:0.07},
  {winScore:6, speed:5.2, paddle:{h:72,speed:7.2}, aiPredictionErr:0.20, spawnRate:0.10},
  {winScore:6, speed:5.5, paddle:{h:70,speed:7.5}, aiPredictionErr:0.15, spawnRate:0.12},
  {winScore:5, speed:5.8, paddle:{h:68,speed:7.8}, aiPredictionErr:0.10, spawnRate:0.15},
  {winScore:5, speed:6.1, paddle:{h:66,speed:8.1}, aiPredictionErr:0.08, spawnRate:0.17},
  {winScore:5, speed:6.4, paddle:{h:64,speed:8.4}, aiPredictionErr:0.05, spawnRate:0.19},
  {winScore:4, speed:6.7, paddle:{h:62,speed:8.7}, aiPredictionErr:0.03, spawnRate:0.20}
];

let currentLevel = 0;
let mode = '2p';
let running = false;
let animId = null;
let particles = [];
let powerups = [];

let state = {};

function initState() {
  const level = LEVELS[currentLevel];
  return {
    ball: { x: W/2, y: H/2, vx: 4, vy: 3, r: 8, speed: level.speed },
    p1: { y: H/2 - level.paddle.h/2, h: level.paddle.h, w: 12, speed: level.paddle.speed, score: 0, frozenTime: 0 },
    p2: { y: H/2 - level.paddle.h/2, h: level.paddle.h, w: 12, speed: level.paddle.speed, score: 0, frozenTime: 0 },
    keys: {},
    aiTarget: H/2,
    aiErr: 0,
    slowMoTime: 0
  };
}

function resize() {
  W = canvas.offsetWidth;
  H = 400;
  canvas.width  = W;
  canvas.height = H;
}

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function loop() {
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function update() {
  const { ball, p1, p2 } = state;
  const level = LEVELS[currentLevel];
  const PAD_GAP = 20;

  // Apply slow-mo
  const slowMoFactor = state.slowMoTime > 0 ? 0.3 : 1;
  state.slowMoTime = Math.max(0, state.slowMoTime - 1);

  // Update freeze status
  p1.frozenTime = Math.max(0, p1.frozenTime - 1);
  p2.frozenTime = Math.max(0, p2.frozenTime - 1);

  // Player 1 controls
  if (!p1.frozenTime) {
    if (keys['w'] || keys['W']) p1.y -= p1.speed * slowMoFactor;
    if (keys['s'] || keys['S']) p1.y += p1.speed * slowMoFactor;
  }
  p1.y = Math.max(0, Math.min(H - p1.h, p1.y));

  // Player 2 controls or AI
  if (mode === '2p') {
    if (!p2.frozenTime) {
      if (keys['ArrowUp'])   p2.y -= p2.speed * slowMoFactor;
      if (keys['ArrowDown']) p2.y += p2.speed * slowMoFactor;
    }
  } else {
    if (!p2.frozenTime) aiMove(p2, ball);
  }
  p2.y = Math.max(0, Math.min(H - p2.h, p2.y));

  // Ball movement
  ball.x += ball.vx * slowMoFactor;
  ball.y += ball.vy * slowMoFactor;

  // Wall bounce
  if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy *= -1; }
  if (ball.y + ball.r >= H) { ball.y = H - ball.r; ball.vy *= -1; }

  // Paddle collision: P1
  const p1x = PAD_GAP + p1.w;
  if (ball.vx < 0 && ball.x - ball.r <= p1x && ball.x - ball.r >= PAD_GAP && 
      ball.y >= p1.y && ball.y <= p1.y + p1.h) {
    ball.x = p1x + ball.r;
    ball.vx = Math.abs(ball.vx);
    const relY = (ball.y - (p1.y + p1.h/2)) / (p1.h/2);
    ball.vy = relY * 6;
    speedUp();
    createPaddleParticles(p1x, ball.y, '#00f5ff');
  }

  // Paddle collision: P2
  const p2x = W - PAD_GAP - p2.w;
  if (ball.vx > 0 && ball.x + ball.r >= p2x && ball.x + ball.r <= W - PAD_GAP && 
      ball.y >= p2.y && ball.y <= p2.y + p2.h) {
    ball.x = p2x - ball.r;
    ball.vx = -Math.abs(ball.vx);
    const relY = (ball.y - (p2.y + p2.h/2)) / (p2.h/2);
    ball.vy = relY * 6;
    speedUp();
    createPaddleParticles(p2x, ball.y, '#ff00aa');
  }

  // Scoring
  if (ball.x - ball.r <= 0) {
    p2.score++;
    updateScore();
    if (p2.score >= level.winScore) { endGame(2); return; }
    resetBall(-1);
  }
  if (ball.x + ball.r >= W) {
    p1.score++;
    updateScore();
    if (p1.score >= level.winScore) { endGame(1); return; }
    resetBall(1);
  }

  // Update power-ups
  updatePowerups();

  // Spawn power-ups randomly
  if (Math.random() < level.spawnRate && powerups.length < 2) {
    spawnPowerup();
  }
}

function updatePowerups() {
  powerups = powerups.filter(pu => {
    const p1 = state.p1, p2 = state.p2;
    let collected = false;

    // Check paddle collision
    if (pu.y > p1.y && pu.y < p1.y + p1.h && pu.x < 100) {
      activatePowerup(pu.type, 0);
      collected = true;
    } else if (pu.y > p2.y && pu.y < p2.y + p2.h && pu.x > W - 100) {
      activatePowerup(pu.type, 1);
      collected = true;
    }

    if (!collected) {
      pu.x += pu.vx;
      pu.life--;
    }

    return !collected && pu.life > 0;
  });
}

function spawnPowerup() {
  const types = ['slowmo', 'spin', 'freeze'];
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({
    x: W/2 + (Math.random() - 0.5) * 200,
    y: Math.random() * (H - 60) + 30,
    vx: (Math.random() - 0.5) * 3,
    life: 300,
    type
  });
}

function activatePowerup(type, player) {
  if (type === 'slowmo') {
    state.slowMoTime = 120;
    createExplosion(state.ball.x, state.ball.y, 'cyan');
  } else if (type === 'spin') {
    state.ball.vy += (Math.random() - 0.5) * 8;
    createExplosion(state.ball.x, state.ball.y, 'green');
  } else if (type === 'freeze') {
    const opponent = player === 0 ? state.p2 : state.p1;
    opponent.frozenTime = 180;
    createExplosion(opponent.x, opponent.y, 'magenta');
  }
}

function createPaddleParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI * 2 / 6) * i;
    particles.push({
      x, y,
      vx: Math.cos(angle) * 2,
      vy: Math.sin(angle) * 2,
      life: 1,
      size: Math.random() * 2 + 1,
      color
    });
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      size: Math.random() * 3 + 1,
      color: color === 'cyan' ? '#00f5ff' : color === 'green' ? '#00ff88' : '#ff00aa'
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.03;
    return p.life > 0;
  });
}

function speedUp() {
  const s = state.ball;
  const mag = Math.sqrt(s.vx*s.vx + s.vy*s.vy);
  const newMag = Math.min(mag * 1.04, 14);
  s.vx = (s.vx/mag) * newMag;
  s.vy = (s.vy/mag) * newMag;
}

function aiMove(p2, ball) {
  const level = LEVELS[currentLevel];
  if (ball.vx > 0) {
    const distX = (W - 20 - p2.w) - ball.x;
    const timeToArrive = distX / ball.vx;
    let predictY = ball.y + ball.vy * timeToArrive;
    const bounces = Math.floor(Math.abs(predictY) / H);
    predictY = bounces % 2 === 0 ? Math.abs(predictY % H) : H - Math.abs(predictY % H);
    state.aiTarget = predictY + state.aiErr;
  } else {
    state.aiTarget = H / 2;
  }

  if (Math.random() < 0.02) {
    state.aiErr = (Math.random() - 0.5) * 60 * level.aiPredictionErr;
  }

  const center = p2.y + p2.h / 2;
  const diff = state.aiTarget - center;
  if (Math.abs(diff) > 4) {
    p2.y += Math.sign(diff) * Math.min(p2.speed, Math.abs(diff));
  }
}

function resetBall(direction) {
  const level = LEVELS[currentLevel];
  state.ball = {
    x: W/2, y: H/2,
    vx: level.speed * direction,
    vy: (Math.random() * 4 - 2),
    r: 8, speed: level.speed
  };
  state.aiErr = 0;
}

function draw() {
  const { ball, p1, p2 } = state;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#020208';
  ctx.fillRect(0, 0, W, H);

  // Center line
  ctx.setLineDash([10, 14]);
  ctx.strokeStyle = 'rgba(0,245,255,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw paddles
  drawPaddle(20, p1.y, p1.w, p1.h, '#00f5ff', p1.frozenTime > 0);
  drawPaddle(W - 20 - p2.w, p2.y, p2.w, p2.h, '#ff00aa', p2.frozenTime > 0);

  // Draw ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  const grd = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, ball.r*2.5);
  grd.addColorStop(0, 'rgba(0,245,255,.5)');
  grd.addColorStop(1, 'rgba(0,245,255,0)');
  ctx.fillStyle = grd;
  ctx.fill();

  // Draw power-ups
  powerups.forEach(pu => {
    ctx.save();
    ctx.globalAlpha = pu.life / 300;
    const colors = {slowmo: '#00ff88', spin: '#ffd700', freeze: '#ff00aa'};
    ctx.fillStyle = colors[pu.type];
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Draw particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Slow-mo effect
  if (state.slowMoTime > 0) {
    ctx.fillStyle = `rgba(0,255,136,${(state.slowMoTime / 120) * 0.15})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,255,136,.8)';
    ctx.font = 'bold 14px Orbitron,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SLOW-MO', W/2, 30);
  }
}

function drawPaddle(x, y, w, h, color, frozen) {
  ctx.shadowColor = color;
  ctx.shadowBlur = frozen ? 0 : 18;
  ctx.fillStyle = frozen ? 'rgba(255,0,170,.3)' : color;
  ctx.fillRect(x, y, w, h);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, w, 3);
  ctx.fillRect(x, y+h-3, w, 3);
}

function updateScore() {
  document.getElementById('s1').textContent = state.p1.score;
  document.getElementById('s2').textContent = state.p2.score;
}

function endGame(winner) {
  running = false;
  cancelAnimationFrame(animId);
  const name = winner === 1 ? (mode === 'ai' ? 'You' : 'Player 1') : (mode === 'ai' ? 'AI' : 'Player 2');
  const nextLevel = currentLevel + 1;
  const canProgress = nextLevel < LEVELS.length;
  showOverlay(`${winner===1?'🏆':'🤖'} ${name} Wins!`, `Level ${currentLevel+1}/10`, canProgress ? 'Next Level' : 'Final Victory!');
  draw();
}

function showOverlay(title, sub, btnText) {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlaySub').textContent = sub;
  document.getElementById('overlayBtn').textContent = btnText;
}

function startGame() {
  resize();
  state = initState();
  running = true;
  particles = [];
  powerups = [];
  updateScore();
  const level = LEVELS[currentLevel];
  document.getElementById('levelInfo').textContent = `Lv${currentLevel+1}/10`;
  document.getElementById('winTarget').textContent = `First to ${level.winScore}`;
  document.getElementById('overlay').classList.add('hidden');
  if (animId) cancelAnimationFrame(animId);
  loop();
}

function setMode(m) {
  mode = m;
  document.getElementById('btn2p').classList.toggle('active', m==='2p');
  document.getElementById('btnAI').classList.toggle('active', m==='ai');
  document.getElementById('lbl2').textContent = m==='ai' ? 'AI' : 'Player 2';
  const ctrl2 = document.getElementById('ctrl2');
  ctrl2.querySelector('h4').textContent = m==='ai' ? '// AI (Right)' : '// Player 2 (Right)';
  ctrl2.querySelector('p').innerHTML = m==='ai' ? 'Powered by <b>predictive AI</b> with spin reading' : '<span class="key">↑</span> Move Up &nbsp; <span class="key">↓</span> Move Down';
  if (running) { cancelAnimationFrame(animId); }
  showOverlay('PING PONG', m==='ai' ? 'You vs AI' : '2 Players · 1 Keyboard', 'START GAME');
  document.getElementById('overlay').classList.remove('hidden');
}

window.addEventListener('resize', () => {
  resize();
  if (!running) { draw(); }
});
resize();
ctx.fillStyle = '#020208'; ctx.fillRect(0, 0, W, H);
</script>
