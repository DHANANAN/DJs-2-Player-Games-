<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<meta name="description" content="3D Pong — classic Pong in a 3D neon tunnel. Play vs AI or challenge a friend online via room code using WebRTC."/>
<title>3D Pong — DJ's Games Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--green:#00ff88;
  --panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  display:flex;flex-direction:column;align-items:center;touch-action:none;}
body::before{content:'';position:fixed;inset:0;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px);pointer-events:none;}

#three-wrap{position:fixed;inset:0;z-index:0;}

.hud{position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;}
.nav-back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.4rem .8rem;letter-spacing:.1em;
  transition:all .3s;background:rgba(4,4,13,.7);}
.nav-back:hover{color:var(--cyan);border-color:var(--cyan);}
.score-hud{display:flex;gap:1rem;align-items:center;background:rgba(4,4,13,.8);
  border:1px solid var(--border);padding:.4rem 1.2rem;}
.score-p{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;}
.score-p.p1{color:var(--cyan);text-shadow:0 0 14px rgba(0,245,255,.6);}
.score-p.p2{color:var(--magenta);text-shadow:0 0 14px rgba(255,0,170,.6);}
.score-sep{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--dim);}
.game-title-hud{font-family:'Press Start 2P',monospace;font-size:.7rem;color:var(--cyan);
  text-shadow:0 0 14px rgba(0,245,255,.6);background:rgba(4,4,13,.7);padding:.3rem .6rem;}

.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(4,4,13,.88);}
.overlay.h{display:none;}
.ov-title{font-family:'Press Start 2P',monospace;font-size:clamp(1rem,4vw,2rem);
  color:var(--gold);text-shadow:0 0 30px rgba(255,215,0,.7);text-align:center;margin-bottom:.8rem;}
.ov-sub{font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--dim);letter-spacing:.15em;
  margin-bottom:1.5rem;text-align:center;line-height:2;}
.mode-tabs{display:flex;gap:.5rem;margin-bottom:1.2rem;flex-wrap:wrap;justify-content:center;}
.mode-tab{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.12em;
  padding:.55rem 1.3rem;background:transparent;color:var(--dim);border:1px solid var(--dim);
  cursor:pointer;transition:all .25s;}
.mode-tab.active{background:var(--cyan);color:var(--bg);border-color:var(--cyan);}
.ov-btn{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;
  padding:.8rem 2rem;background:var(--cyan);color:var(--bg);border:none;cursor:pointer;
  box-shadow:0 0 22px rgba(0,245,255,.5);transition:all .25s;margin:.3rem;}
.ov-btn:hover{background:#fff;}
.ov-btn.sec{background:transparent;color:var(--dim);border:1px solid var(--dim);box-shadow:none;}
.ov-btn.sec:hover{color:var(--cyan);border-color:var(--cyan);}

/* Online lobby */
.lobby{display:none;flex-direction:column;align-items:center;gap:.8rem;margin-top:.5rem;}
.lobby.show{display:flex;}
.lobby-code{font-family:'Press Start 2P',monospace;font-size:2rem;color:var(--gold);
  text-shadow:0 0 20px rgba(255,215,0,.8);letter-spacing:.3em;padding:.5rem 1rem;
  border:1px solid var(--gold);background:rgba(255,215,0,.05);}
.lobby-input{font-family:'Orbitron',sans-serif;font-size:1.2rem;letter-spacing:.3em;
  padding:.5rem 1rem;background:rgba(0,245,255,.05);border:1px solid var(--border);
  color:var(--cyan);text-align:center;width:160px;text-transform:uppercase;}
.lobby-status{font-family:'Orbitron',sans-serif;font-size:.55rem;color:var(--dim);
  letter-spacing:.12em;text-align:center;}
.lobby-status.ok{color:var(--green);}
.lobby-status.err{color:#ff4455;}

/* Virtual touchpad (mobile) */
.vtouch{position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;padding:.5rem;
  pointer-events:none;}
.vtouch-inner{pointer-events:all;width:200px;height:60px;
  background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.25);
  border-radius:30px;position:relative;display:flex;align-items:center;justify-content:center;}
.vtouch-lbl{font-family:'Orbitron',sans-serif;font-size:.45rem;color:var(--dim);}
@media(pointer:fine){.vtouch{display:none!important;}}
</style>
</head>
<body>

<div id="three-wrap"></div>

<div class="hud">
  <a href="index.html" class="nav-back">← Hub</a>
  <div class="score-hud">
    <div class="score-p p1" id="s1">0</div>
    <div class="score-sep">—</div>
    <div class="score-p p2" id="s2">0</div>
  </div>
  <div class="game-title-hud">3D PONG</div>
</div>

<div class="overlay" id="overlay">
  <div class="ov-title">3D PONG</div>
  <div class="ov-sub">Navigate the neon tunnel · First to 7 wins<br>Move paddle with mouse / touch / arrow keys</div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabAI" onclick="setTab('ai')">🤖 vs AI</button>
    <button class="mode-tab" id="tab2P" onclick="setTab('2p')">👥 Local 2P</button>
    <button class="mode-tab" id="tabOnline" onclick="setTab('online')">🌐 Online</button>
  </div>

  <div class="lobby" id="lobbyPanel">
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;">
      <button class="ov-btn" onclick="createRoom()">Create Room</button>
      <button class="ov-btn sec" onclick="showJoin()">Join Room</button>
    </div>
    <div class="lobby-code" id="lobbyCode" style="display:none">----</div>
    <div style="display:none;" id="joinPanel">
      <input class="lobby-input" id="joinInput" maxlength="4" placeholder="CODE" oninput="this.value=this.value.toUpperCase()"/>
      <button class="ov-btn" onclick="joinRoom()">Connect</button>
    </div>
    <div class="lobby-status" id="lobbyStatus">Select Create or Join</div>
  </div>

  <button class="ov-btn" id="startBtn" onclick="startGame()">START GAME</button>
</div>

<!-- Mobile touch zone -->
<div class="vtouch" id="vtouch">
  <div class="vtouch-inner" id="touchZone">
    <span class="vtouch-lbl">◀ DRAG PADDLE ▶</span>
  </div>
</div>

<script>
// ─── 3D PONG ENGINE (Three.js) ────────────────────────
let scene, camera, renderer;
let playerPaddle, aiPaddle, ball, ballLight;
let tunnelMesh, wallMeshes=[];
let running=false, animId=null;
let mode='ai'; // 'ai', '2p', 'online'
const keys={};
const WIN=7;

// Ball state
let ballVel={x:0,y:0,z:0};
let scores=[0,0];

// Online (PeerJS)
let peer=null, conn=null, isHost=false;

// ── Scene Setup ──
function initThree(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x010108);
  scene.fog=new THREE.Fog(0x010108,25,80);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true;
  document.getElementById('three-wrap').appendChild(renderer.domElement);

  camera=new THREE.PerspectiveCamera(65,window.innerWidth/window.innerHeight,0.1,200);
  camera.position.set(0,3,-22);
  camera.lookAt(0,0,0);

  // Lights
  scene.add(new THREE.AmbientLight(0x111133,0.8));
  const dirLight=new THREE.DirectionalLight(0x00f5ff,1.2);
  dirLight.position.set(0,10,-15);
  scene.add(dirLight);
  const dirLight2=new THREE.DirectionalLight(0xff00aa,0.8);
  dirLight2.position.set(0,-5,15);
  scene.add(dirLight2);

  buildTunnel();
  buildPaddles();
  buildBall();

  window.addEventListener('resize',onResize);
}

const TUNNEL_W=10, TUNNEL_H=7, TUNNEL_DEPTH=40;

function buildTunnel(){
  const mat=new THREE.MeshStandardMaterial({color:0x001122,wireframe:false,side:THREE.BackSide});

  // Create tunnel as a box (hollow from inside)
  const geo=new THREE.BoxGeometry(TUNNEL_W,TUNNEL_H,TUNNEL_DEPTH);
  tunnelMesh=new THREE.Mesh(geo,mat);
  scene.add(tunnelMesh);

  // Glowing edges
  const edgeMat=new THREE.LineBasicMaterial({color:0x00f5ff,linewidth:2});
  const edges=new THREE.EdgesGeometry(geo);
  const wireframe=new THREE.LineSegments(edges,edgeMat);
  scene.add(wireframe);

  // Grid lines on walls for depth perception
  for(let z=-18;z<=18;z+=4){
    addLine(-TUNNEL_W/2,TUNNEL_H/2,z, TUNNEL_W/2,TUNNEL_H/2,z, 0x001e1e);
    addLine(-TUNNEL_W/2,-TUNNEL_H/2,z, TUNNEL_W/2,-TUNNEL_H/2,z, 0x001e1e);
    addLine(-TUNNEL_W/2,-TUNNEL_H/2,z, -TUNNEL_W/2,TUNNEL_H/2,z, 0x001e1e);
    addLine(TUNNEL_W/2,-TUNNEL_H/2,z, TUNNEL_W/2,TUNNEL_H/2,z, 0x001e1e);
  }
}

function addLine(x1,y1,z1,x2,y2,z2,color){
  const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y1,z1),new THREE.Vector3(x2,y2,z2)]);
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:.4}));
  scene.add(line);
}

function buildPaddles(){
  const geo=new THREE.BoxGeometry(2.5,1.8,0.3);
  const mat1=new THREE.MeshStandardMaterial({color:0x00f5ff,emissive:0x003344,emissiveIntensity:.5});
  const mat2=new THREE.MeshStandardMaterial({color:0xff00aa,emissive:0x330022,emissiveIntensity:.5});

  playerPaddle=new THREE.Mesh(geo,mat1);
  playerPaddle.position.set(0,0,-TUNNEL_DEPTH/2+1.5);
  scene.add(playerPaddle);

  // Player paddle glow
  const pLight=new THREE.PointLight(0x00f5ff,1.5,8);
  playerPaddle.add(pLight);

  aiPaddle=new THREE.Mesh(geo,mat2);
  aiPaddle.position.set(0,0,TUNNEL_DEPTH/2-1.5);
  scene.add(aiPaddle);

  const aLight=new THREE.PointLight(0xff00aa,1.5,8);
  aiPaddle.add(aLight);
}

function buildBall(){
  const geo=new THREE.SphereGeometry(0.4,16,16);
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x00f5ff,emissiveIntensity:1});
  ball=new THREE.Mesh(geo,mat);
  scene.add(ball);

  ballLight=new THREE.PointLight(0x00f5ff,2,6);
  ball.add(ballLight);
}

// ── Game Logic ──
function resetBall(dir=1){
  ball.position.set(0,0,0);
  const speed=12;
  ballVel={
    x:(Math.random()-.5)*8,
    y:(Math.random()-.5)*6,
    z:speed*dir
  };
  ballLight.color.set(dir>0?0x00f5ff:0xff00aa);
}

function update(dt){
  if(!running) return;

  // Ball movement
  ball.position.x+=ballVel.x*dt;
  ball.position.y+=ballVel.y*dt;
  ball.position.z+=ballVel.z*dt;

  // Wall bounces (X and Y)
  const maxX=TUNNEL_W/2-0.4, maxY=TUNNEL_H/2-0.4;
  if(Math.abs(ball.position.x)>maxX){ ball.position.x=Math.sign(ball.position.x)*maxX; ballVel.x*=-1.05; }
  if(Math.abs(ball.position.y)>maxY){ ball.position.y=Math.sign(ball.position.y)*maxY; ballVel.y*=-1.05; }

  // Cap speed
  const spd=Math.sqrt(ballVel.x**2+ballVel.y**2+ballVel.z**2);
  if(spd>22){ const f=22/spd; ballVel.x*=f; ballVel.y*=f; ballVel.z*=f; }

  // Player paddle input
  const pSpeed=8;
  const pb=TUNNEL_W/2-1.3, hb=TUNNEL_H/2-0.9;

  if(mode==='2p'){
    // P1 (left side of keyboard)
    if(keys['a']||keys['A']) playerPaddle.position.x=Math.max(-pb,playerPaddle.position.x-pSpeed*dt);
    if(keys['d']||keys['D']) playerPaddle.position.x=Math.min(pb,playerPaddle.position.x+pSpeed*dt);
    if(keys['w']||keys['W']) playerPaddle.position.y=Math.min(hb,playerPaddle.position.y+pSpeed*dt);
    if(keys['s']||keys['S']) playerPaddle.position.y=Math.max(-hb,playerPaddle.position.y-pSpeed*dt);
    // P2 (arrows)
    if(keys['ArrowLeft']) aiPaddle.position.x=Math.max(-pb,aiPaddle.position.x-pSpeed*dt);
    if(keys['ArrowRight']) aiPaddle.position.x=Math.min(pb,aiPaddle.position.x+pSpeed*dt);
    if(keys['ArrowUp']) aiPaddle.position.y=Math.min(hb,aiPaddle.position.y+pSpeed*dt);
    if(keys['ArrowDown']) aiPaddle.position.y=Math.max(-hb,aiPaddle.position.y-pSpeed*dt);
  } else {
    // Player 1 always uses arrows + WASD
    if(keys['ArrowLeft']||keys['a']||keys['A']) playerPaddle.position.x=Math.max(-pb,playerPaddle.position.x-pSpeed*dt);
    if(keys['ArrowRight']||keys['d']||keys['D']) playerPaddle.position.x=Math.min(pb,playerPaddle.position.x+pSpeed*dt);
    if(keys['ArrowUp']||keys['w']||keys['W']) playerPaddle.position.y=Math.min(hb,playerPaddle.position.y+pSpeed*dt);
    if(keys['ArrowDown']||keys['s']||keys['S']) playerPaddle.position.y=Math.max(-hb,playerPaddle.position.y-pSpeed*dt);
  }

  // AI paddle (only in 'ai' mode or when online-guest)
  if(mode==='ai'){
    const aiSpeed=6.5+scores[1]*0.15;
    const ex=ball.position.x, ey=ball.position.y;
    aiPaddle.position.x+=(ex-aiPaddle.position.x)*aiSpeed*dt*0.6;
    aiPaddle.position.y+=(ey-aiPaddle.position.y)*aiSpeed*dt*0.5;
    // Add imperfection
    aiPaddle.position.x+=Math.sin(Date.now()*0.002)*0.3;
    aiPaddle.position.x=Math.max(-pb,Math.min(pb,aiPaddle.position.x));
    aiPaddle.position.y=Math.max(-hb,Math.min(hb,aiPaddle.position.y));
  }

  // Paddle collision (player side)
  const playerZ=-TUNNEL_DEPTH/2+1.5;
  if(ball.position.z<playerZ+1&&ballVel.z<0){
    const dx=ball.position.x-playerPaddle.position.x;
    const dy=ball.position.y-playerPaddle.position.y;
    if(Math.abs(dx)<1.5&&Math.abs(dy)<1.1){
      ball.position.z=playerZ+1;
      ballVel.z=Math.abs(ballVel.z)*1.06;
      ballVel.x+=dx*2;
      ballVel.y+=dy*2;
      ballLight.color.set(0x00f5ff);
    }
  }

  // Paddle collision (AI/P2 side)
  const aiZ=TUNNEL_DEPTH/2-1.5;
  if(ball.position.z>aiZ-1&&ballVel.z>0){
    const dx=ball.position.x-aiPaddle.position.x;
    const dy=ball.position.y-aiPaddle.position.y;
    if(Math.abs(dx)<1.5&&Math.abs(dy)<1.1){
      ball.position.z=aiZ-1;
      ballVel.z=-Math.abs(ballVel.z)*1.06;
      ballVel.x+=dx*2;
      ballVel.y+=dy*2;
      ballLight.color.set(0xff00aa);
    }
  }

  // Score (ball exits)
  if(ball.position.z<-TUNNEL_DEPTH/2-2){
    scores[1]++;
    document.getElementById('s2').textContent=scores[1];
    if(scores[1]>=WIN){ endGame(1); return; }
    resetBall(1);
  }
  if(ball.position.z>TUNNEL_DEPTH/2+2){
    scores[0]++;
    document.getElementById('s1').textContent=scores[0];
    if(scores[0]>=WIN){ endGame(0); return; }
    resetBall(-1);
  }

  // Camera chase
  camera.position.x+=(playerPaddle.position.x*0.2-camera.position.x)*3*dt;
  camera.position.y+=(playerPaddle.position.y*0.1+3-camera.position.y)*3*dt;
  camera.lookAt(ball.position.x*0.3,ball.position.y*0.2,0);

  // Online sync
  if(mode==='online'&&conn&&conn.open){
    if(isHost){
      conn.send({type:'state',
        bx:ball.position.x,by:ball.position.y,bz:ball.position.z,
        p1x:playerPaddle.position.x,p1y:playerPaddle.position.y,
        p2x:aiPaddle.position.x,p2y:aiPaddle.position.y,
        s:scores
      });
    } else {
      conn.send({type:'input',px:playerPaddle.position.x,py:playerPaddle.position.y});
    }
  }
}

let lastTime=0;
function loop(time){
  const dt=Math.min((time-lastTime)/1000,0.033);
  lastTime=time;
  if(running){
    update(dt);
  }
  renderer.render(scene,camera);
  animId=requestAnimationFrame(loop);
}

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

// ── Game state ──
function startGame(){
  scores=[0,0];
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  playerPaddle.position.set(0,0,-TUNNEL_DEPTH/2+1.5);
  aiPaddle.position.set(0,0,TUNNEL_DEPTH/2-1.5);
  document.getElementById('overlay').classList.add('h');
  running=true;
  resetBall(1);
}

function endGame(winner){
  running=false;
  const ov=document.getElementById('overlay');
  ov.classList.remove('h');
  const p=winner===0?(mode==='ai'?'YOU WIN!':'P1 WINS!'):(mode==='ai'?'AI WINS!':'P2 WINS!');
  ov.querySelector('.ov-title').textContent=`🏆 ${p}`;
  ov.querySelector('.ov-sub').textContent=`Final: ${scores[0]} — ${scores[1]}`;
  document.getElementById('startBtn').textContent='Play Again';
  document.getElementById('lobbyPanel').classList.remove('show');
}

// ── Mode tabs ──
function setTab(tab){
  mode=tab;
  ['ai','2p','online'].forEach(t=>{
    document.getElementById('tab'+{ai:'AI','2p':'2P',online:'Online'}[t]).classList.toggle('active',t===tab);
  });
  document.getElementById('lobbyPanel').classList.toggle('show',tab==='online');
  document.getElementById('startBtn').style.display=tab==='online'?'none':'inline-block';
}

// ── PeerJS Online ──
function createRoom(){
  const code=Math.floor(1000+Math.random()*9000).toString();
  document.getElementById('lobbyCode').textContent=code;
  document.getElementById('lobbyCode').style.display='block';
  document.getElementById('joinPanel').style.display='none';
  document.getElementById('lobbyStatus').textContent='Waiting for opponent…';
  document.getElementById('lobbyStatus').className='lobby-status';

  if(peer) peer.destroy();
  peer=new Peer('DJHUB'+code);
  isHost=true;

  peer.on('open',id=>{
    document.getElementById('lobbyStatus').textContent=`Code: ${code} · Share with friend!`;
  });
  peer.on('connection',c=>{
    conn=c;
    conn.on('open',()=>{
      document.getElementById('lobbyStatus').textContent='Opponent connected! Starting…';
      document.getElementById('lobbyStatus').className='lobby-status ok';
      setTimeout(startGame,1500);
    });
    conn.on('data',d=>{
      if(!isHost&&d.type==='state'){
        ball.position.set(d.bx,d.by,d.bz);
        aiPaddle.position.set(d.p2x,d.p2y,aiPaddle.position.z);
        scores=d.s;
        document.getElementById('s1').textContent=scores[0];
        document.getElementById('s2').textContent=scores[1];
      }
      if(isHost&&d.type==='input'){
        aiPaddle.position.x=d.px;
        aiPaddle.position.y=d.py;
      }
    });
    conn.on('close',()=>{ document.getElementById('lobbyStatus').textContent='Opponent disconnected'; document.getElementById('lobbyStatus').className='lobby-status err'; running=false; });
  });
  peer.on('error',e=>{ document.getElementById('lobbyStatus').textContent='Connection error: '+e.type; document.getElementById('lobbyStatus').className='lobby-status err'; });
}

function showJoin(){
  document.getElementById('lobbyCode').style.display='none';
  document.getElementById('joinPanel').style.display='block';
  document.getElementById('lobbyStatus').textContent='Enter room code';
}

function joinRoom(){
  const code=document.getElementById('joinInput').value.trim();
  if(code.length!==4){ document.getElementById('lobbyStatus').textContent='Enter 4-digit code'; return; }
  document.getElementById('lobbyStatus').textContent='Connecting…';

  if(peer) peer.destroy();
  peer=new Peer();
  isHost=false;
  peer.on('open',()=>{
    conn=peer.connect('DJHUB'+code);
    conn.on('open',()=>{
      document.getElementById('lobbyStatus').textContent='Connected! Waiting for host…';
      document.getElementById('lobbyStatus').className='lobby-status ok';
    });
    conn.on('data',d=>{
      if(d.type==='state'){
        // Guest: mirror state (our paddle is the "player" paddle from our perspective)
        ball.position.set(-d.bx,d.by,-d.bz+TUNNEL_DEPTH/2-(-TUNNEL_DEPTH/2));
        // Simplified: just use raw positions
        ball.position.set(d.bx,d.by,d.bz);
        playerPaddle.position.set(d.p2x,d.p2y,playerPaddle.position.z);
        scores=d.s;
        document.getElementById('s1').textContent=scores[1];
        document.getElementById('s2').textContent=scores[0];
        if(!running){running=true;document.getElementById('overlay').classList.add('h');}
      }
    });
    conn.on('close',()=>{ document.getElementById('lobbyStatus').className='lobby-status err'; document.getElementById('lobbyStatus').textContent='Host disconnected'; });
  });
  peer.on('error',e=>{ document.getElementById('lobbyStatus').textContent='Error: '+e.type; document.getElementById('lobbyStatus').className='lobby-status err'; });
}

// ── Input ──
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if(e.key.length===1) keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(e.key.length===1) keys[e.key.toLowerCase()]=false;
});

// Touch (move player paddle)
const touchZone=document.getElementById('touchZone');
let touchStartX=0, touchStartY=0, touchPaddleX=0, touchPaddleY=0;
touchZone.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchPaddleX=playerPaddle.position.x;
  touchPaddleY=playerPaddle.position.y;
},{passive:true});
touchZone.addEventListener('touchmove',e=>{
  const dx=(e.touches[0].clientX-touchStartX)/(window.innerWidth)*20;
  const dy=-(e.touches[0].clientY-touchStartY)/(window.innerHeight)*14;
  const pb=TUNNEL_W/2-1.3, hb=TUNNEL_H/2-0.9;
  playerPaddle.position.x=Math.max(-pb,Math.min(pb,touchPaddleX+dx));
  playerPaddle.position.y=Math.max(-hb,Math.min(hb,touchPaddleY+dy));
},{passive:true});

// Mouse control
document.addEventListener('mousemove',e=>{
  if(!running) return;
  const nx=(e.clientX/window.innerWidth-.5)*(TUNNEL_W-2.5);
  const ny=-(e.clientY/window.innerHeight-.5)*(TUNNEL_H-1.8);
  const pb=TUNNEL_W/2-1.3, hb=TUNNEL_H/2-0.9;
  playerPaddle.position.x=Math.max(-pb,Math.min(pb,nx));
  playerPaddle.position.y=Math.max(-hb,Math.min(hb,ny));
});

// ── Boot ──
initThree();
requestAnimationFrame(loop);
</script>
</body>
</html>
