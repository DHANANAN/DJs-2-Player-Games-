  const t = localStorage.getItem('djhub_theme') || 'neon';
  document.documentElement.className = 'theme-' + t;
})();

<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--green:#00ff88;
  --panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1rem .8rem;overflow-x:hidden;touch-action:none;}
body::before{content:'';position:fixed;inset:0;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;}
.nav{width:100%;max-width:680px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.45rem .9rem;letter-spacing:.1em;transition:all .3s;}
.back:hover{color:var(--cyan);border-color:var(--cyan);}
.title{font-family:'Press Start 2P',monospace;font-size:.85rem;color:var(--cyan);
  text-shadow:0 0 18px rgba(0,245,255,.6);}

.hud{width:100%;max-width:680px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:.6rem;}
.sb{text-align:center;padding:.4rem;border:1px solid var(--border);background:var(--panel);}
.sb+.sb{border-left:none;}
.sn{font-family:'Orbitron',sans-serif;font-size:1.15rem;font-weight:900;color:var(--gold);}
.sl{font-family:'Orbitron',sans-serif;font-size:.45rem;color:var(--dim);letter-spacing:.12em;}

.cw{position:relative;width:min(680px,96vw);border:1px solid var(--border);
  background:#010108;margin-bottom:.6rem;overflow:hidden;touch-action:none;border-radius:4px;}
.cw::before{content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,var(--cyan),var(--magenta));z-index:-1;opacity:.4;}
canvas{display:block;width:100%;touch-action:none;}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(4,4,13,.92);z-index:10;padding:1rem;}
.ov.h{display:none;}
.ot{font-family:'Press Start 2P',monospace;font-size:clamp(.85rem,3.5vw,1.4rem);
  color:var(--gold);text-shadow:0 0 28px rgba(255,215,0,.7);text-align:center;margin-bottom:.6rem;}
.os{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--dim);letter-spacing:.12em;margin-bottom:1.4rem;text-align:center;line-height:1.8;}
.ob{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;
  padding:.75rem 2rem;background:var(--cyan);color:var(--bg);border:none;cursor:pointer;transition:all .25s;}
.ob:hover{background:#fff;}

.touch-actions{width:100%;max-width:680px;display:flex;justify-content:space-between;gap:1rem;margin-bottom:.6rem;}
.t-btn{
  flex:1;padding:.75rem;background:rgba(0,245,255,0.12);border:1.5px solid rgba(0,245,255,0.4);
  color:var(--cyan);font-family:'Orbitron',sans-serif;font-weight:900;font-size:.8rem;
  border-radius:10px;cursor:pointer;text-align:center;user-select:none;touch-action:none;
}
.t-btn:active{background:rgba(0,245,255,0.4);}
.t-btn.slide{background:rgba(255,0,170,0.15);border-color:#ff00aa;color:#ff00aa;}
.t-btn.slide:active{background:rgba(255,0,170,0.5);}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="back">← Hub</a>
  <span class="title">🏃 Cyber Runner</span>
  <span style="width:70px"></span>
</nav>

<div class="hud">
  <div class="sb"><div class="sn" id="distEl">0m</div><div class="sl">DISTANCE</div></div>
  <div class="sb"><div class="sn" id="coinsEl" style="color:var(--cyan)">0</div><div class="sl">COINS</div></div>
  <div class="sb"><div class="sn" id="shieldEl" style="color:var(--green)">OFF</div><div class="sl">SHIELD</div></div>
  <div class="sb"><div class="sn" id="bestEl" style="color:var(--magenta)">0m</div><div class="sl">RECORD</div></div>
</div>

<div class="cw" id="cw">
  <canvas id="c" height="380"></canvas>
  <div class="ov" id="ov">
    <div class="ot">CYBER RUNNER</div>
    <div class="os">Fast &amp; Smooth Cyber Sprint!<br>
      ⬆️ Swipe UP / Space: Jump &amp; Double Jump<br>
      ⬇️ Swipe DOWN: Slide under Lasers<br>
      🛡️ Collect Shields to survive hazards!</div>
    <button class="ob" onclick="startGame()">START SPRINT</button>
  </div>
</div>

<div class="touch-actions">
  <button class="t-btn" id="btnJump">⬆️ JUMP / DOUBLE JUMP</button>
  <button class="t-btn slide" id="btnSlide">⬇️ SLIDE UNDER</button>
</div>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W, H, groundY;
let running = false, animId = null;
let distance = 0, coins = 0, bestDist = parseInt(localStorage.getItem('dj_runner_best') || '0');
let speed = 4.2;
let spawnTimer = 0;

let player, obstacles = [], coinItems = [], powerups = [], particles = [];
const keys = {};

function resize(){
  W = canvas.offsetWidth;
  H = 380;
  canvas.width = W;
  canvas.height = H;
  groundY = H - 55;
}

function initGame(){
  resize();
  distance = 0; coins = 0; speed = 4.2; spawnTimer = 0;
  player = {
    x: 90, y: groundY, vy: 0,
    w: 24, h: 54,
    isJumping: false, jumpsLeft: 2,
    isSliding: false, slideTimer: 0,
    shield: false, animTime: 0,
    invincibleTimer: 0
  };
  obstacles = []; coinItems = []; powerups = []; particles = [];
  document.getElementById('bestEl').textContent = bestDist + 'm';
  document.getElementById('shieldEl').textContent = 'OFF';
  document.getElementById('shieldEl').style.color = 'var(--dim)';
}

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if(running){
    if((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') && player.jumpsLeft > 0) jump();
    if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') slide();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch Action Buttons
document.getElementById('btnJump').addEventListener('touchstart', e => { e.preventDefault(); jump(); });
document.getElementById('btnSlide').addEventListener('touchstart', e => { e.preventDefault(); slide(); });
document.getElementById('btnJump').addEventListener('mousedown', e => { e.preventDefault(); jump(); });
document.getElementById('btnSlide').addEventListener('mousedown', e => { e.preventDefault(); slide(); });

// Touch Swipe on Canvas
let touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  if(!e.touches[0]) return;
  touchStartY = e.touches[0].clientY;
}, {passive: true});

canvas.addEventListener('touchend', e => {
  if(!running) return;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(dy < -20) jump();
  else if(dy > 20) slide();
}, {passive: true});

function jump(){
  if(player.jumpsLeft > 0){
    player.vy = -11.5;
    player.isJumping = true;
    player.isSliding = false;
    player.jumpsLeft--;
    spawnParticles(player.x, player.y + 10, '#00f5ff', 8);
  }
}

function slide(){
  if(!player.isJumping){
    player.isSliding = true;
    player.slideTimer = 34; // Generous slide duration
    spawnParticles(player.x, player.y + 10, '#ff00aa', 6);
  }
}

function spawnEntities(){
  spawnTimer++;
  // Minimum safe gap between obstacles (at least 90 frames)
  if(spawnTimer > 95 && Math.random() < 0.04){
    spawnTimer = 0;
    const isGroundSpike = Math.random() > 0.45;
    if(isGroundSpike){
      obstacles.push({x: W + 40, y: groundY - 18, w: 26, h: 36, type: 'spike'});
    } else {
      obstacles.push({x: W + 40, y: groundY - 62, w: 42, h: 18, type: 'laser'});
    }

    // Spawn power-up occasionally
    if(Math.random() < 0.25 && !player.shield){
      powerups.push({x: W + 120, y: groundY - 50, type: 'shield', r: 12});
    }
  }

  // Coins spawn
  if(Math.random() < 0.035){
    const coinY = groundY - (Math.random() > 0.5 ? 24 : 70);
    coinItems.push({x: W + 30, y: coinY, r: 8});
  }
}

function update(){
  if(!running) return;

  distance += speed * 0.07;
  speed = Math.min(8.5, speed + 0.0003); // Very gentle speed scaling for easy enjoyment
  player.animTime += speed * 0.08;

  if(player.invincibleTimer > 0) player.invincibleTimer--;

  // Player Physics
  player.vy += 0.52;
  player.y += player.vy;

  if(player.y >= groundY){
    player.y = groundY;
    player.vy = 0;
    player.isJumping = false;
    player.jumpsLeft = 2;
  }

  if(player.isSliding){
    player.slideTimer--;
    if(player.slideTimer <= 0) player.isSliding = false;
  }

  spawnEntities();

  const curH = player.isSliding ? 22 : 50;
  const curY = player.isSliding ? player.y + 12 : player.y;

  // Obstacles (Generous fair hitboxes)
  for(let i = obstacles.length - 1; i >= 0; i--){
    const ob = obstacles[i];
    ob.x -= speed;

    // Forgiving collision box: reduce collision boundaries by 4px
    const collideX = Math.abs(ob.x - player.x) < ((ob.w + player.w) / 2 - 5);
    const collideY = Math.abs(ob.y - (curY - curH / 2)) < ((ob.h + curH) / 2 - 5);

    if(collideX && collideY && player.invincibleTimer <= 0){
      if(player.shield){
        // Shield absorbs hit
        player.shield = false;
        player.invincibleTimer = 45;
        document.getElementById('shieldEl').textContent = 'OFF';
        document.getElementById('shieldEl').style.color = 'var(--dim)';
        spawnParticles(player.x, curY - 20, '#00ff88', 25);
        obstacles.splice(i, 1);
        continue;
      } else {
        endGame();
        return;
      }
    }
    if(ob.x < -60) obstacles.splice(i, 1);
  }

  // Coins
  for(let i = coinItems.length - 1; i >= 0; i--){
    const c = coinItems[i];
    c.x -= speed;
    if(Math.hypot(c.x - player.x, c.y - (curY - curH / 2)) < 30){
      coins++;
      spawnParticles(c.x, c.y, '#ffd700', 8);
      coinItems.splice(i, 1);
      continue;
    }
    if(c.x < -30) coinItems.splice(i, 1);
  }

  // Power-ups
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.x -= speed;
    if(Math.hypot(p.x - player.x, p.y - (curY - curH / 2)) < 32){
      if(p.type === 'shield'){
        player.shield = true;
        document.getElementById('shieldEl').textContent = 'ACTIVE';
        document.getElementById('shieldEl').style.color = 'var(--green)';
        spawnParticles(p.x, p.y, '#00ff88', 16);
      }
      powerups.splice(i, 1);
      continue;
    }
    if(p.x < -30) powerups.splice(i, 1);
  }

  // Particles
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx - speed * 0.4;
    p.y += p.vy;
    p.alpha -= 0.035;
    if(p.alpha <= 0) particles.splice(i, 1);
  }

  document.getElementById('distEl').textContent = Math.floor(distance) + 'm';
  document.getElementById('coinsEl').textContent = coins;
}

function spawnParticles(x, y, col, count){
  for(let i = 0; i < count; i++){
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      alpha: 1, col
    });
  }
}

// ── PROPER ANIMATED CYBER RUNNER CHARACTER ──
function drawCyberRunner(p){
  ctx.save();
  ctx.translate(p.x, p.y);

  if(p.invincibleTimer > 0 && Math.floor(Date.now() / 60) % 2 === 0){
    ctx.globalAlpha = 0.4;
  }

  const t = p.animTime;

  if(p.isSliding){
    // ── SLIDING CYBER POSE ──
    // Sliding Sparks
    for(let s = 0; s < 2; s++){
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(-15 - Math.random() * 20, 2, 3, 3);
    }
    // Low Torso & Armor
    ctx.fillStyle = '#0a1a2f';
    ctx.fillRect(-22, -18, 38, 14);
    // Neon glow line
    ctx.fillStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 8;
    ctx.fillRect(-20, -12, 34, 3);
    // Head with visor
    ctx.fillStyle = '#102238'; ctx.beginPath(); ctx.arc(14, -14, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00f5ff'; ctx.fillRect(14, -16, 7, 4);
    // Sliding Extended Legs
    ctx.fillStyle = '#00f5ff'; ctx.fillRect(-26, -6, 24, 6);
    ctx.shadowBlur = 0;
  } else if(p.isJumping){
    // ── ACROBATIC JUMP POSE ──
    // Billowing Neon Scarf Trail
    ctx.strokeStyle = '#ff00aa'; ctx.lineWidth = 3; ctx.shadowColor = '#ff00aa'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(-6, -38);
    ctx.quadraticCurveTo(-22, -34 + Math.sin(t) * 6, -36, -42);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Torso / Jet Chest
    ctx.fillStyle = '#0a1a2f'; ctx.fillRect(-8, -38, 16, 22);
    ctx.fillStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 8;
    ctx.fillRect(-6, -30, 12, 4); // Chest reactor

    // Head & Helmet
    ctx.fillStyle = '#102238'; ctx.beginPath(); ctx.arc(0, -44, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00f5ff'; ctx.fillRect(1, -46, 7, 5); // Visor

    // Tucked Legs
    ctx.strokeStyle = '#00f5ff'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-4, -16); ctx.lineTo(-12, -8); ctx.lineTo(-4, -4);
    ctx.moveTo(4, -16); ctx.lineTo(12, -10); ctx.lineTo(6, -6);
    ctx.stroke();
    ctx.shadowBlur = 0;
  } else {
    // ── DYNAMIC RUNNING SPRINT CYCLE ──
    const leg1 = Math.sin(t) * 16;
    const leg2 = -leg1;
    const arm1 = -Math.sin(t) * 14;
    const arm2 = -arm1;
    const bob = Math.abs(Math.sin(t * 2)) * 3;

    // Flowing Neon Scarf
    ctx.strokeStyle = '#ff00aa'; ctx.lineWidth = 3; ctx.shadowColor = '#ff00aa'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(-6, -38 + bob);
    ctx.quadraticCurveTo(-20, -32 + Math.sin(t * 1.5) * 6 + bob, -34, -36 + bob);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Back Arm
    ctx.strokeStyle = '#0a2540'; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-2, -34 + bob); ctx.lineTo(-2 + arm2, -22 + bob);
    ctx.stroke();

    // Legs with Knees and Cyber Boots
    ctx.strokeStyle = '#00f5ff'; ctx.lineWidth = 4; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 6;
    // Leg 1
    ctx.beginPath();
    ctx.moveTo(-4, -16 + bob);
    ctx.lineTo(-4 + leg1 * 0.6, -8 + bob);
    ctx.lineTo(-4 + leg1, 0);
    ctx.stroke();

    // Leg 2
    ctx.beginPath();
    ctx.moveTo(4, -16 + bob);
    ctx.lineTo(4 + leg2 * 0.6, -8 + bob);
    ctx.lineTo(4 + leg2, 0);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Torso Armor
    ctx.fillStyle = '#0a1a2f'; ctx.fillRect(-8, -38 + bob, 16, 22);
    ctx.fillStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 8;
    ctx.fillRect(-5, -30 + bob, 10, 4); // Core light
    ctx.shadowBlur = 0;

    // Front Arm
    ctx.strokeStyle = '#00f5ff'; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(2, -34 + bob); ctx.lineTo(2 + arm1, -22 + bob);
    ctx.stroke();

    // Head & Glowing Visor
    ctx.fillStyle = '#102238'; ctx.beginPath(); ctx.arc(0, -44 + bob, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 10;
    ctx.fillRect(1, -46 + bob, 7, 5); // Visor
    ctx.shadowBlur = 0;
  }

  // ── SHIELD BUBBLE FORCEFIELD ──
  if(p.shield){
    ctx.strokeStyle = '#00ff88'; ctx.fillStyle = 'rgba(0,255,136,0.12)';
    ctx.lineWidth = 2; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(0, -26, 32, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#010108'; ctx.fillRect(0, 0, W, H);

  // Distant Cyber City Skyline
  ctx.fillStyle = '#080c1a';
  for(let i = 0; i < 9; i++){
    const sx = (i * 90 - (distance * 0.3) % 90);
    ctx.fillRect(sx, groundY - 110 - (i % 3) * 28, 65, 200);
  }

  // Ground Grid
  ctx.fillStyle = '#0d1326'; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.strokeStyle = '#ff00aa'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

  // Grid vertical perspective ticks
  ctx.strokeStyle = 'rgba(0,245,255,0.2)'; ctx.lineWidth = 1;
  for(let gx = 0; gx < W + 40; gx += 40){
    const rx = (gx - (distance * 1.5) % 40);
    ctx.beginPath(); ctx.moveTo(rx, groundY); ctx.lineTo(rx - 20, H); ctx.stroke();
  }

  // Powerups (Shields)
  powerups.forEach(p => {
    ctx.fillStyle = '#00ff88'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '12px Orbitron'; ctx.textAlign = 'center';
    ctx.fillText('🛡️', p.x, p.y + 4);
    ctx.shadowBlur = 0;
  });

  // Coins
  coinItems.forEach(c => {
    ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(c.x, c.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Obstacles
  obstacles.forEach(ob => {
    if(ob.type === 'spike'){
      ctx.fillStyle = '#ff4455'; ctx.shadowColor = '#ff4455'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(ob.x, ob.y - ob.h / 2);
      ctx.lineTo(ob.x + ob.w / 2, ob.y + ob.h / 2);
      ctx.lineTo(ob.x - ob.w / 2, ob.y + ob.h / 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 14;
      ctx.fillRect(ob.x - ob.w / 2, ob.y - ob.h / 2, ob.w, ob.h);
      ctx.shadowBlur = 0;
    }
  });

  // Draw Cyber Runner Character
  drawCyberRunner(player);

  // Particles
  particles.forEach(p => {
    ctx.fillStyle = p.col; ctx.globalAlpha = p.alpha;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function loop(){
  update();
  draw();
  if(running) animId = requestAnimationFrame(loop);
}

function startGame(){
  initGame();
  running = true;
  document.getElementById('ov').classList.add('h');
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function endGame(){
  running = false;
  cancelAnimationFrame(animId);
  if(distance > bestDist){
    bestDist = Math.floor(distance);
    localStorage.setItem('dj_runner_best', bestDist.toString());
  }
  const ov = document.getElementById('ov');
  ov.classList.remove('h');
  ov.querySelector('.ot').textContent = '💥 RUN COMPLETE';
  ov.querySelector('.os').textContent = `Distance: ${Math.floor(distance)}m · Coins: ${coins}`;
  ov.querySelector('.ob').textContent = 'RUN AGAIN';
}

window.addEventListener('resize', () => { if(running) resize(); });
resize();
ctx.fillStyle = '#010108'; ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
