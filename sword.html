<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sword Duels — DJ's Games Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#04040d;--cyan:#00f5ff;--magenta:#ff00aa;--gold:#ffd700;--green:#00ff88;
  --red:#ff4455;--panel:rgba(0,245,255,.04);--border:rgba(0,245,255,.18);--text:#c8d8ff;--dim:#5a6a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.2rem 1rem;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;}
.nav{width:100%;max-width:700px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.back{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:var(--dim);
  text-decoration:none;border:1px solid var(--dim);padding:.45rem .9rem;letter-spacing:.1em;transition:all .3s;}
.back:hover{color:var(--cyan);border-color:var(--cyan);}
.title{font-family:'Press Start 2P',monospace;font-size:.85rem;color:var(--red);
  text-shadow:0 0 18px rgba(255,68,85,.7);}
.health-bar-row{width:100%;max-width:700px;display:grid;grid-template-columns:1fr auto 1fr;
  gap:.5rem;margin-bottom:.8rem;align-items:center;}
.hp-block{display:flex;flex-direction:column;gap:.3rem;}
.hp-block.right{align-items:flex-end;}
.hp-name{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.1em;}
.hp-name.p1{color:var(--cyan);}
.hp-name.p2{color:var(--magenta);}
.hp-bar-wrap{width:100%;height:18px;background:rgba(255,255,255,.06);border:1px solid var(--border);position:relative;}
.hp-bar{height:100%;transition:width .1s;}
.hp-bar.p1{background:linear-gradient(90deg,#00f5ff,#00aaff);}
.hp-bar.p2{background:linear-gradient(90deg,#ff00aa,#ff4488);}
.hp-val{font-family:'Orbitron',sans-serif;font-size:.55rem;color:var(--dim);}
.vs-block{text-align:center;}
.round-lbl{font-family:'Press Start 2P',monospace;font-size:.55rem;color:var(--gold);}
.lives-row{display:flex;gap:3px;justify-content:center;margin-top:.3rem;}
.life-dot{width:8px;height:8px;border-radius:50%;}
.cw{position:relative;width:min(700px,96vw);border:1px solid var(--border);
  background:#020208;margin-bottom:.8rem;overflow:hidden;}
.cw::before{content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,var(--red),var(--magenta));z-index:-1;opacity:.5;}
canvas{display:block;width:100%;}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(4,4,13,.9);z-index:10;}
.ov.h{display:none;}
.ot{font-family:'Press Start 2P',monospace;font-size:clamp(.85rem,3.5vw,1.5rem);
  color:var(--gold);text-shadow:0 0 28px rgba(255,215,0,.7);text-align:center;margin-bottom:.6rem;}
.os{font-family:'Orbitron',sans-serif;font-size:.55rem;color:var(--dim);letter-spacing:.1em;margin-bottom:1.3rem;text-align:center;line-height:2;}
.ob{font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.2em;
  padding:.8rem 2rem;background:var(--red);color:#fff;border:none;cursor:pointer;transition:all .25s;}
.ob:hover{background:#fff;color:var(--bg);}
.ctrl{width:100%;max-width:700px;display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.cb{border:1px solid var(--border);background:var(--panel);padding:.8rem 1rem;}
.cb h4{font-family:'Orbitron',sans-serif;font-size:.55rem;color:var(--cyan);letter-spacing:.15em;margin-bottom:.5rem;}
.cb p{font-size:.8rem;color:var(--dim);line-height:1.8;}
.k{display:inline-block;font-family:'Orbitron',sans-serif;font-size:.5rem;
  padding:.1rem .35rem;border:1px solid var(--border);color:var(--text);background:rgba(255,255,255,.05);}
</style>
</head>
<body>
<nav class="nav">
  <a href="../index.html" class="back">← Hub</a>
  <span class="title">Sword Duels</span>
  <span style="width:70px"></span>
</nav>

<div class="health-bar-row">
  <div class="hp-block">
    <div class="hp-name p1">PLAYER 1</div>
    <div class="hp-bar-wrap"><div class="hp-bar p1" id="hp1" style="width:100%"></div></div>
    <div class="hp-val" id="hv1">100 HP</div>
  </div>
  <div class="vs-block">
    <div class="round-lbl" id="roundLbl">Round 1</div>
    <div class="lives-row" id="lives1"></div>
    <div style="font-family:'Orbitron',sans-serif;font-size:.5rem;color:var(--dim);margin:.15rem 0">VS</div>
    <div class="lives-row" id="lives2"></div>
  </div>
  <div class="hp-block right">
    <div class="hp-name p2">PLAYER 2</div>
    <div class="hp-bar-wrap"><div class="hp-bar p2" id="hp2" style="width:100%"></div></div>
    <div class="hp-val" id="hv2">100 HP</div>
  </div>
</div>

<div class="cw">
  <canvas id="c" height="420"></canvas>
  <div class="ov" id="ov">
    <div class="ot">⚔️ SWORD DUEL</div>
    <div class="os">Best of 3 rounds<br>Move · Jump · Attack · Block<br>Drain opponent's HP to win</div>
    <button class="ob" onclick="startGame()">FIGHT!</button>
  </div>
</div>

<div class="ctrl">
  <div class="cb"><h4>// Player 1 (Cyan)</h4>
    <p><span class="k">A</span>/<span class="k">D</span> Move · <span class="k">W</span> Jump<br>
       <span class="k">F</span> Attack · <span class="k">G</span> Block</p></div>
  <div class="cb"><h4>// Player 2 (Pink)</h4>
    <p><span class="k">←</span>/<span class="k">→</span> Move · <span class="k">↑</span> Jump<br>
       <span class="k">K</span> Attack · <span class="k">L</span> Block</p></div>
</div>

<script>
/* ─── SWORD DUEL ENGINE ──────────────────────────────────
   Side-scrolling 2D fighter.
   Each fighter has: position, velocity, HP, state.
   States: idle, run, jump, attack, block, hurt, dead
   Attack hitbox extends in facing direction.
   Blocking reduces damage by 80%.
   Best of 3 rounds.
────────────────────────────────────────────────────────── */
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H,GROUND;
const keys={};

const MAX_HP=100;
const MOVE_SPD=3.2, JUMP_F=-11, GRAV=.45, ATK_DMG=12, BLK_DMG=2.5;
const ATK_COOLDOWN=35, HURT_TIME=18, ATK_ANIM=22;

let f1,f2,rounds=[0,0],roundNum=1,animId=null,running=false;
let hurtFlash=0;
let bgParticles=[];

function resize(){
  W=canvas.offsetWidth; H=420;
  canvas.width=W; canvas.height=H;
  GROUND=H*.78;
}

function mkFighter(x,facingRight,col,glow,keys_){
  return{x,y:GROUND,vx:0,vy:0,w:28,h:60,
    hp:MAX_HP,alive:true,facingRight,
    state:'idle',atkTimer:0,hurtTimer:0,blockActive:false,
    col,glow,
    k:keys_, // control keys
    atkSwing:0 // for sword animation
  };
}

function initRound(){
  f1=mkFighter(W*.2,true,'#00f5ff','rgba(0,245,255,.6)',{left:'a',right:'d',jump:'w',atk:'f',blk:'g'});
  f2=mkFighter(W*.8,false,'#ff00aa','rgba(255,0,170,.6)',{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',atk:'k',blk:'l'});
  hurtFlash=0;
  initBgParticles();
}

function initBgParticles(){
  bgParticles=Array.from({length:30},()=>({
    x:Math.random()*W,y:Math.random()*H*.7,
    r:Math.random()*1.5+.3, a:Math.random()*.4, s:Math.random()*.003+.001
  }));
}

window.addEventListener('keydown',e=>{keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  // Map uppercase
  if(e.key.length===1)keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{keys[e.key]=false;
  if(e.key.length===1)keys[e.key.toLowerCase()]=false;
});

function updateFighter(f,opp){
  if(!f.alive||!running)return;
  const k=f.k;

  // Timers
  if(f.atkTimer>0)f.atkTimer--;
  if(f.hurtTimer>0){ f.hurtTimer--; return; } // can't act while hurt
  f.atkSwing=Math.max(0,f.atkSwing-1);

  // Block
  f.blockActive=keys[k.blk]&&f.atkTimer<=0;

  // Attack
  if(keys[k.atk]&&f.atkTimer<=0){
    f.atkTimer=ATK_COOLDOWN;
    f.atkSwing=ATK_ANIM;
    f.state='attack';
    // Hitbox check
    const hitX=f.x+(f.facingRight?f.w+5:-45);
    const hitRange=50;
    if(Math.abs((hitX+hitRange/2)-(opp.x+opp.w/2))<hitRange+opp.w/2 &&
       Math.abs(f.y-opp.y)<f.h*.8){
      const dmg=opp.blockActive?BLK_DMG:ATK_DMG;
      opp.hp=Math.max(0,opp.hp-dmg);
      if(!opp.blockActive){ opp.hurtTimer=HURT_TIME; opp.state='hurt'; }
      opp.vx+=(f.facingRight?1.5:-1.5);
      hurtFlash=6;
      updateHPDisplay();
      if(opp.hp<=0){ endRound(); return; }
    }
  }

  // Movement (only if not attacking with full swing)
  if(f.atkSwing<ATK_ANIM*.6){
    if(keys[k.left]){ f.vx=-MOVE_SPD; f.facingRight=false; f.state='run'; }
    else if(keys[k.right]){ f.vx=MOVE_SPD; f.facingRight=true; f.state='run'; }
    else{ f.vx*=.75; if(Math.abs(f.vx)<.2){ f.vx=0; f.state=f.atkTimer>0?'attack':'idle'; } }
  }

  // Jump
  const onGround=f.y>=GROUND;
  if(keys[k.jump]&&onGround){ f.vy=JUMP_F; f.state='jump'; }

  // Physics
  f.vy+=GRAV;
  f.y+=f.vy;
  f.x+=f.vx;
  if(f.y>=GROUND){ f.y=GROUND; f.vy=0; if(f.state==='jump')f.state='idle'; }

  // Boundaries
  f.x=Math.max(f.w/2,Math.min(W-f.w*1.5,f.x));

  // Face opponent
  if(f.atkTimer<=0&&f.hurtTimer<=0&&!keys[k.left]&&!keys[k.right]){
    f.facingRight=opp.x>f.x;
  }
}

function endRound(){
  running=false;
  const winner=f1.hp>f2.hp?0:1;
  rounds[winner]++;
  updateLives();
  setTimeout(()=>{
    roundNum++;
    if(rounds[0]>=2||rounds[1]>=2){ endMatch(); }
    else{
      initRound();
      running=true;
      document.getElementById('roundLbl').textContent=`Round ${roundNum}`;
    }
  },1500);
}

function endMatch(){
  cancelAnimationFrame(animId);
  const w=rounds[0]>=2?0:1;
  const ov=document.getElementById('ov');
  ov.classList.remove('h');
  ov.querySelector('.ot').textContent=`🏆 Player ${w+1} Wins!`;
  ov.querySelector('.os').textContent=`${rounds[0]}-${rounds[1]} rounds`;
  ov.querySelector('.ob').textContent='Fight Again';
  ov.querySelector('.ob').onclick=startGame;
}

function updateHPDisplay(){
  const h1=Math.max(0,f1.hp), h2=Math.max(0,f2.hp);
  document.getElementById('hp1').style.width=h1+'%';
  document.getElementById('hp2').style.width=h2+'%';
  document.getElementById('hv1').textContent=Math.ceil(h1)+' HP';
  document.getElementById('hv2').textContent=Math.ceil(h2)+' HP';
  if(h1<30)document.getElementById('hp1').style.background='linear-gradient(90deg,#ff4455,#ff6600)';
  if(h2<30)document.getElementById('hp2').style.background='linear-gradient(90deg,#ff4455,#ff6600)';
}

function updateLives(){
  const mk=(wins,el)=>{
    el.innerHTML='';
    for(let i=0;i<3;i++){
      const d=document.createElement('div');
      d.className='life-dot';
      d.style.background=i<wins?'#ffd700':'rgba(255,255,255,.15)';
      d.style.border='1px solid rgba(255,215,0,.4)';
      el.appendChild(d);
    }
  };
  mk(rounds[0],document.getElementById('lives1'));
  mk(rounds[1],document.getElementById('lives2'));
}

/* ─── DRAWING ─── */
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#060010'); g.addColorStop(.7,'#100510'); g.addColorStop(1,'#0a0008');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Particles
  bgParticles.forEach(p=>{
    p.a+=p.s; if(p.a>0.4)p.s*=-1; if(p.a<0)p.s*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,68,85,${p.a})`; ctx.fill();
  });
  // Ground
  const gnd=ctx.createLinearGradient(0,GROUND,0,H);
  gnd.addColorStop(0,'#1a0a2a'); gnd.addColorStop(1,'#0d0618');
  ctx.fillStyle=gnd; ctx.fillRect(0,GROUND,W,H-GROUND+2);
  ctx.strokeStyle='rgba(255,68,85,.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  // Glow on ground
  ctx.strokeStyle='rgba(255,68,85,.1)'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
}

function drawFighter(f){
  const {x,y,w,h,facingRight,col,glow,state,atkSwing,blockActive,hurtTimer}=f;
  const dir=facingRight?1:-1;
  ctx.save();
  ctx.translate(x+w/2, y);
  if(!facingRight) ctx.scale(-1,1);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(0,2,w*.6,8,0,0,Math.PI*2); ctx.fill();

  const flash=hurtTimer>0&&Math.floor(hurtTimer/3)%2===0;
  const col2=flash?'rgba(255,100,100,.9)':col;

  ctx.shadowColor=glow; ctx.shadowBlur=hurtTimer>0?0:12;

  // Legs
  const legAnim=state==='run'?Math.sin(Date.now()*.015)*10:0;
  ctx.fillStyle=flash?'#cc4444':'#222';
  ctx.fillRect(-w/2+2, -h*.45+legAnim, w*.4, h*.42);
  ctx.fillRect(w*.05, -h*.45-legAnim, w*.4, h*.42);

  // Body
  ctx.fillStyle=col2; ctx.fillRect(-w/2,-h*.85,w,h*.45);

  // Cape / scarf effect
  ctx.fillStyle=`rgba(${col==='#00f5ff'?'0,180,255':'255,0,120'},.4)`;
  ctx.beginPath(); ctx.moveTo(-w/2,-h*.85); ctx.lineTo(-w/2-8,-h*.65); ctx.lineTo(-w/2,-h*.55); ctx.fill();

  // Head
  ctx.fillStyle='#d4a57a';
  ctx.beginPath(); ctx.arc(0,-h*.9,w*.32,0,Math.PI*2); ctx.fill();
  // Hair
  ctx.fillStyle=col2;
  ctx.fillRect(-w*.3,-h-10,w*.6,8);
  // Eye
  ctx.fillStyle='#fff';
  ctx.fillRect(w*.1,-h*.92,5,4);
  ctx.fillStyle=flash?'#f00':'#111';
  ctx.fillRect(w*.14,-h*.92,3,3);

  // Sword
  const swingAng=atkSwing>0?(atkSwing/ATK_ANIM)*1.4-0.2:0;
  ctx.save();
  ctx.translate(w*.5,-h*.7);
  ctx.rotate(-Math.PI/6+swingAng);
  // Handle
  ctx.fillStyle='#8b6914'; ctx.fillRect(-3,0,6,12);
  // Guard
  ctx.fillStyle='#aaa'; ctx.fillRect(-8,-2,16,4);
  // Blade
  ctx.fillStyle='rgba(200,230,255,.9)';
  ctx.shadowColor='rgba(180,220,255,.8)'; ctx.shadowBlur=atkSwing>0?12:4;
  ctx.fillRect(-2,-36,4,36);
  // Glint
  if(atkSwing>ATK_ANIM*.5){
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.fillRect(-1,-36,2,8);
  }
  ctx.restore();

  // Block shield
  if(blockActive){
    ctx.shadowColor='rgba(255,215,0,.8)'; ctx.shadowBlur=15;
    ctx.strokeStyle='rgba(255,215,0,.7)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(w*.3,-h*.6,w*.5,-.8,.8); ctx.stroke();
  }

  ctx.shadowBlur=0;
  ctx.restore();

  // Attack flash
  if(atkSwing>ATK_ANIM*.5){
    ctx.strokeStyle=col;
    ctx.globalAlpha=atkSwing/ATK_ANIM*.5;
    ctx.lineWidth=2;
    ctx.beginPath();
    const ax=x+w/2+(facingRight?w*.5:-w*.5);
    ctx.arc(ax,y-h*.7,40,facingRight?-.7:.4,(facingRight?-.7:.4)+1.2);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

function drawHurtFlash(){
  if(hurtFlash>0){
    ctx.fillStyle=`rgba(255,68,85,${hurtFlash*.04})`;
    ctx.fillRect(0,0,W,H);
    hurtFlash--;
  }
}

function draw(){
  ctx.fillStyle='#020208'; ctx.fillRect(0,0,W,H);
  drawBg();
  drawFighter(f1); drawFighter(f2);
  drawHurtFlash();
  // HP update each frame for smooth animation
  if(running) updateHPDisplay();
}

function loop(){
  updateFighter(f1,f2);
  updateFighter(f2,f1);
  draw();
  animId=requestAnimationFrame(loop);
}

function startGame(){
  resize(); rounds=[0,0]; roundNum=1;
  document.getElementById('roundLbl').textContent='Round 1';
  document.getElementById('ov').classList.add('h');
  initRound(); updateLives();
  running=true;
  document.getElementById('hp1').style.background='linear-gradient(90deg,#00f5ff,#00aaff)';
  document.getElementById('hp2').style.background='linear-gradient(90deg,#ff00aa,#ff4488)';
  if(animId)cancelAnimationFrame(animId);
  loop();
}
window.addEventListener('resize',()=>{resize();});
</script>
</body>
</html>
